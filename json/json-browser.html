  renderMeta();                 // reflect restored field switches / auto-link note
  syncFieldUI();                // and the sidebar's field-dependent controls
  const pg=params.one("page"); if(pg){ state.page=Math.max(0,(+pg||1)-1); }
  document.querySelectorAll(".ffield").forEach(d=>{
    const f=state.filters[d.dataset.field];
    if(f) d.dataset.active=(f.vals.size||f.missing||f.present)?"1":"0";
    const b=d.querySelector(".fbody"); if(b){ b.dataset.rendered="0"; if(d.open) renderFieldBody(d); }
  });
}

/* ---------- cards ---------- */
/* `key` is the field the value came from — the gate for name-based auto-linking.
   Arrays pass their field name down to the items; object entries use their own key. */
function renderValue(v,key){
  if(v===null||v===undefined) return '<span class="muted">—</span>';
  if(Array.isArray(v)){
    if(!v.length) return '<span class="muted">[]</span>';
    /* decided per element, not from v[0]: a mixed array would otherwise render its
       objects as "[object Object]", or crash on a null among the objects */
    return v.map(x => (x!==null&&typeof x==="object")
      ? renderObjLine(x,key)
      : '<span class="chip">'+renderScalar(x,key)+'</span>').join("");
  }
  if(typeof v==="object")
    return '<div class="obj">'+Object.entries(v).map(([k,x])=>'<div class="kv"><span class="k">'+esc(k)+'</span><span class="v">'+renderValue(x,k)+'</span></div>').join("")+'</div>';
  return renderScalar(v,key);
}
function renderScalar(v,key){
  if(typeof v==="boolean") return '<span class="bool b-'+v+'">'+v+'</span>';
  const s=String(v);
  const img=isImageURL(s);                                       // includes data: image URIs
  if(/^https?:\/\//i.test(s)||img){                              // a link that was in the data
    const label=img||s.length>URL_TEXT_MAX;                      // a picture never shows its address
    const tip=/^data:/i.test(s) ? "embedded image" : s;          // never dump a base64 payload
    return linkHTML(s, label?linkLabel(s,key):s, label?tip:null, "vlink");
  }
  const hit=autoLinkFor(s,key);                                  // a link we derived
  return hit ? linkHTML(hit.url,s,linkNote(hit),"vlink") : esc(s);
}
function renderObjLine(o,key){
  const t=o.title||o.name||null;
  if(t){ const bits=[]; for(const k of ["journal","venue","source","year","date"]) if(o[k]!=null) bits.push(esc(String(o[k])));
    return '<div class="pub">'+esc(String(t))+(bits.length?' <span class="j">— '+bits.join(", ")+'</span>':'')+'</div>'; }
  return '<div class="pub">'+Object.entries(o).map(([k,x])=>esc(k)+": "+
    (x!==null&&typeof x==="object"?esc(JSON.stringify(x)):renderScalar(x,k))).join("; ")+'</div>';
}
function scalarOptions(){ return state.scalarFields.map(k=>'<option value="'+esc(k)+'">'+esc(k)+'</option>').join(""); }
function populateFieldSelects(){
  const t=$("#titleField"); t.innerHTML=scalarOptions(); t.value=titleField();
  const s=$("#subField"); s.innerHTML='<option value="">(none)</option>'+scalarOptions();
  const sf=subtitleField(); s.value = sf===null ? "" : sf;
  const i=$("#imageField");        // only columns that actually hold images are offered
  i.innerHTML='<option value="">(none)</option>'+
    state.imageFields.map(k=>'<option value="'+esc(k)+'">'+esc(k)+'</option>').join("");
  const imf=imageField(); i.value = imf===null ? "" : imf;
  i.disabled = !state.imageFields.length;
}
function titleField(){
  if(state.titleSel && state.scalarFields.includes(state.titleSel)) return state.titleSel;
  for(const k of ["name","title","display_name","label","id","uid"]) if(state.scalarFields.includes(k)) return k;
  return state.scalarFields[0]||state.fields[0];
}
function subtitleField(){
  if(state.subSel!==null) return (state.subSel==="" || !state.scalarFields.includes(state.subSel)) ? null : state.subSel;
  return null;   // no subtitle by default — generic; the user picks one in Display options
}
/* Which fields a record shows, and in what order. The card, the text copy and the
   HTML copy must agree about that, so all three read it from here rather than each
   walking the field lists its own way. The parts that are the same for every record
   — which column is the title, the subtitle, the thumbnail — are computed once. */
function cardCtx(){
  const imf=imageField();
  return {tf:titleField(), sub:subtitleField(), imgF:(imf&&!state.hidden.has(imf))?imf:null};
}
function recordRows(r,ctx){
  const {tf,sub,imgF}=ctx;
  /* only a value that really is a picture becomes the thumbnail; anything else in
     that column stays an ordinary row rather than a broken image */
  const iv=imgF?val(r,imgF):undefined;
  const img=(!isMissing(iv)&&typeof iv!=="object"&&isImageValue(iv,imgF))?iv:null;
  const rows=[], nested=[];
  for(const k of state.scalarFields){ if(k===tf||k===sub||state.hidden.has(k)) continue;
    if(k===imgF&&img!==null) continue;                     // shown as the thumbnail instead
    if(state.notesAdopted&&k===NOTE_FIELD) continue;       // the note box IS this field
    const v=val(r,k); if(isMissing(v)) continue;           // hide empty scalar fields
    rows.push({k,v,long:isLongText(k)}); }
  for(const k of state.complexFields){ if(state.hidden.has(k)) continue; const v=val(r,k);
    const n=Array.isArray(v)?v.length:(v&&typeof v==="object"?Object.keys(v).length:0);
    if(v==null||n===0) continue;   // skip empty non-scalar fields
    nested.push({k,v,n}); }
  /* undefined means "no subtitle": a value that is missing never passes isMissing */
  const sv=sub&&sub!==tf?val(r,sub):undefined;
  return {tv:val(r,tf), sub:isMissing(sv)?undefined:sv, img, imgKey:imgF, rows, nested};
}
function renderCards(){
  $("#cards").className="grid"+(state.viewMode==="full"?" full":"");
  const full=state.viewMode==="full", ctx=cardCtx();
  $("#cards").innerHTML=state.pageItems.map((r,idx)=>{
    const d=recordRows(r,ctx), tv=d.tv;
    /* a heading that is itself an identifier becomes a link, keeping the heading's own color */
    const th=(tv!=null&&typeof tv!=="object")?autoLinkFor(tv,ctx.tf):null;
    const title=(tv==null)?'<span class="muted">(untitled)</span>'
              : th?linkHTML(th.url,String(tv),linkNote(th),"vlink"):esc(String(tv));
    const subv=d.sub===undefined?'':'<span class="sub">'+esc(String(d.sub))+'</span>';
    let kv='', lt='', cf='';
    for(const {k,v,long} of d.rows){
      if(long){
        /* A full-width row already gives prose room to read, so print it there and
           skip the expander; on a card it would be a ribbon, so collapse it. */
        lt+= full
          ? '<div class="lt"><span class="lt-k">'+esc(k)+'</span><div class="lt-v">'+renderValue(v,k)+'</div></div>'
          : '<details class="cf txt" data-idx="'+idx+'" data-field="'+esc(k)+'">'+
            '<summary title="double-click to open this field on every card">'+esc(k)+
            '<span class="peek">'+esc(textPeek(v))+'</span></summary>'+
            '<div class="cf-body" data-rendered="0"></div></details>';
        continue;
      }
      kv+='<div class="kv"><span class="k">'+esc(k)+'</span><span class="v">'+renderValue(v,k)+'</span></div>'; }
    if(full) kv='<div class="kvwrap">'+kv+'</div>';
    for(const {k,n} of d.nested)
      cf+='<details class="cf" data-idx="'+idx+'" data-field="'+esc(k)+'">'+
          '<summary title="double-click to open this field on every card">'+esc(k)+' ('+n+')</summary>'+
          '<div class="cf-body" data-rendered="0"></div></details>';
    const img=d.img!==null?imageHTML(d.img,tv==null?"":String(tv)):"";
    const head='<h3>'+title+' '+subv+'</h3>';
    const on=state.selected.has(r);
    const note=state.notes.get(r)||"";
    /* the note goes after every other field and before the select box's strip */
    const nb=state.notesOn
      ? '<textarea class="note'+(note?" has":"")+'" rows="1" data-idx="'+idx+'"'+
        ' aria-label="Note on this record" placeholder="note…">'+esc(note)+'</textarea>' : '';
    const box='<input type="checkbox" class="selbox" data-idx="'+idx+'"'+(on?' checked':'')+
      ' title="select this record — double-click for every card on the page"'+
      ' aria-label="Select this record">';
    const cls='card'+(img?' has-img':'')+(on?' sel':'');
    /* the picture shares the top line with the heading; everything below is full width */
    return img ? '<div class="'+cls+'"><div class="cardhead">'+head+img+'</div>'+kv+lt+cf+nb+box+'</div>'
               : '<div class="'+cls+'">'+head+kv+lt+cf+nb+box+'</div>';
  }).join("");
  /* a textarea cannot size itself to its content, so every one of them is measured
     once here — and again on each keystroke */
  if(state.notesOn) $("#cards").querySelectorAll(".note").forEach(growNote);
  renderSelBar();
}
/* one line while it holds one line, taller as it fills */
function growNote(ta){ ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px"; }

/* ---------- selection ----------
   The box in the corner of a card puts that record in the basket the two copy
   buttons empty. Held by reference, so filtering, sorting and paging cost the
   selection nothing; kept out of the URL — a shared link carries a view, not a
   basket, and the records it names might not even be in the reader's file. */
function renderSelBar(){
  const n=state.selected.size;
  $("#selbar").hidden=!n;
  $("#selCount").textContent=n+" selected";
  /* the page box reads like a table's header checkbox: ticked when the whole page is
     in, part-way when only some of it is */
  const boxes=$("#cards").querySelectorAll(".selbox"), on=[...boxes].filter(b=>b.checked).length;
  const p=$("#selPage");
  p.checked = boxes.length>0 && on===boxes.length;
  p.indeterminate = on>0 && on<boxes.length;
}
/* Take the whole page, or give it back. The double-click and the box in the bar are
   the same gesture — the second one exists because touch has no double-click and a
   keyboard cannot make one either. */
function setPageSelection(on){
  for(const b of $("#cards").querySelectorAll(".selbox")){
    const r=state.pageItems[+b.dataset.idx];
    if(on) state.selected.add(r); else state.selected.delete(r);
    b.checked=on; const c=b.closest(".card"); if(c) c.classList.toggle("sel",on);
  }
  renderSelBar();
}
function clearSelection(){
  state.selected.clear();
  for(const cb of $("#cards").querySelectorAll(".selbox")){
    cb.checked=false; const c=cb.closest(".card"); if(c) c.classList.remove("sel"); }
  renderSelBar();
}
/* The order the page is sorted in — one rule, whether or not a record is on screen
   at this moment. Starting from file order and applying the page's own comparator
   reproduces the on-screen order exactly for everything visible (a stable sort over
   a subsequence keeps its relative order), and drops a selected record the filters
   are currently hiding into its proper place rather than at the end. */
function selectedRecords(){
  const sel=state.selected; if(!sel.size) return [];
  const out=state.records.filter(r=>sel.has(r));
  const levels=activeSorts();
  if(levels.length) out.sort((x,y)=>cmpMulti(x,y,levels));
  return out;
}

/* ---------- copy as text ----------
   The card without its markup. HTML collapses runs of whitespace, so this does
   too: a value hard-wrapped in the source file is not broken on screen, and must
   not arrive broken in the paste either. */
const flat = s => String(s).replace(/\s+/g," ").trim();
const textScalar = v => typeof v==="boolean" ? String(v) : flat(v);
function textObj(o){
  const t=o.title||o.name||null;
  if(t){ const bits=[]; for(const k of ["journal","venue","source","year","date"]) if(o[k]!=null) bits.push(flat(o[k]));
    return flat(t)+(bits.length?" — "+bits.join(", "):""); }
  return Object.entries(o).map(([k,v])=>k+": "+
    (v!==null&&typeof v==="object"?JSON.stringify(v):textScalar(v))).join("; ");
}
/* An array of objects gets a line per item; everything else stays on the field's
   own line. `pad` is the indent the field itself sits at. */
function textValue(v,pad){
  if(v===null||v===undefined) return "—";
  if(Array.isArray(v)){
    if(!v.length) return "[]";
    if(!v.some(x=>x!==null&&typeof x==="object")) return v.map(textScalar).join("; ");
    return "\n"+v.map(x=>pad+"  "+((x!==null&&typeof x==="object")?textObj(x):textScalar(x))).join("\n");
  }
  if(typeof v==="object") return textObj(v);
  return textScalar(v);
}
/* ---------- notes ----------
   A line of the reader's own against any record. They never reach the URL, they are
   not filtered or sorted on, and they last only as long as the page is open — which
   is why leaving with unsaved ones is worth a warning. Two ways out, one per button:
   N copies the noted records as text, the green one downloads the whole file with
   the notes written into it. Only the download counts as saving them.
   A file that ALREADY keeps notes is a file already being annotated, so its column
   is adopted rather than duplicated: the values fill the boxes, the field stops
   being drawn as a row of its own, and the page opens with the boxes up. Only a
   scalar column can be adopted — one holding objects is data of another kind, and
   keeps its place while the notes go beside it under a name of their own. */
const NOTE_FIELD = "notes";
const NOTE_LABEL = () =>
  (!state.notesAdopted && state.fields.includes(NOTE_FIELD)) ? "notes (added)" : NOTE_FIELD;
const noteOf = r => state.notes.get(r)||"";
/* Something to write: normally a note to carry, but on an adopted column an edit
   that emptied the last one is a change too — the file has to lose the field. */
const notesPending = () => state.notesDirty && (state.notes.size>0 || state.notesAdopted);
function seedNotes(){
  state.notesAdopted=false;
  if(!state.fields.includes(NOTE_FIELD)) return;
  for(const r of state.records){ const v=val(r,NOTE_FIELD);
    if(v!==null && v!==undefined && typeof v==="object") return; }   // not ours to edit
  state.notesAdopted=true;
  for(const r of state.records){ const v=val(r,NOTE_FIELD);
    if(!isMissing(v)) state.notes.set(r,String(v)); }
  state.notesOn=true;                        // straight into writing: that is the job here
}
function renderNoteBtn(){
  const b=$("#noteBtn"), c=$("#noteCopy"), n=state.notes.size, dirty=notesPending();
  b.classList.toggle("dirty",dirty);
  b.classList.toggle("on",state.notesOn);   // green means the boxes are up, saved or not
  b.setAttribute("aria-pressed",String(state.notesOn));
  b.title = dirty
    ? "Download the file as JSON, with "+(n?n+(n===1?" note":" notes"):"the notes")+" written in"
    : state.notesOn ? "Hide the note boxes" : "Add a note to each record";
  /* the copy comes up with the boxes once there is something in them, and rides with
     the notes rather than with the unsaved state: it is a way of reading them out,
     not of keeping them */
  c.hidden=!(state.notesOn&&n);
  c.title="Copy "+n+(n===1?" noted record":" noted records")+" as text";
}
function setNotesOn(on){
  state.notesOn=on;
  renderCards();                 // the boxes are part of the card, not an overlay
  renderNoteBtn();
}
/* Records carrying a note, in the order the page is sorted — the same rule the
   copies follow, so a saved file and a pasted copy agree. */
function notedRecords(){
  if(!state.notes.size) return [];
  const out=state.records.filter(r=>state.notes.has(r));
  const levels=activeSorts();
  if(levels.length) out.sort((x,y)=>cmpMulti(x,y,levels));
  return out;
}
/* The text the N button copies: exactly what the records themselves would copy,
   narrowed to the ones carrying a note. */
const notesText = () => blocksText(notedRecords(),false,true);
async function copyNotesText(btn){
  const rs=notedRecords(); if(!rs.length) return;
  const okd=await copyOut(notesText(),null);
  flash(btn, okd, rs.length+(rs.length===1?" noted record":" noted records")+" as text");
}
/* The file as loaded with the notes written into it. The whole structure is kept —
   wrapper keys, sibling arrays, and every record, filtered in or not — and only the
   records of the array on screen are touched: a note becomes a field, a note emptied
   takes the field away again, but only on an adopted column. Where the file has a
   notes field of its own that is NOT ours, the note goes in beside it under the same
   name the copies give it, so nothing of the data is overwritten.
   The replacer returns copies rather than editing the records: the page keeps
   showing the file it loaded, and a download changes nothing on screen. */
function notesJSONText(){
  const key=NOTE_LABEL(), mine=new Set(state.records), adopted=state.notesAdopted;
  return JSON.stringify(state.raw, (k,v)=>{
    if(!v || typeof v!=="object" || !mine.has(v)) return v;
    const note=noteOf(v).trim();
    if(note) return {...v, [key]:note};
    if(adopted && own.call(v,key)){ const c={...v}; delete c[key]; return c; }
    return v;
  }, 2);
}
function saveBlob(text,type,name){
  const a=document.createElement("a");
  const url=URL.createObjectURL(new Blob([text],{type}));
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
/* Under the file's own name: what comes down is the file that went up, notes and
   all, ready to be put back where it came from. The name is taken apart because it
   may be a URL or a path — a query string or a directory would make a poor filename
   — and the browser is left to add its own "(1)" if the original is still in the
   download folder. */
function downloadNotesJSON(){
  const name=(state.fileName||"").replace(/[?#].*$/,"").replace(/^.*[\\/]/,"")
             || "records.json";
  saveBlob(notesJSONText(),"application/json;charset=utf-8",name);
  state.notesDirty=false;        // written out; the button goes back to being a toggle
  renderNoteBtn();
  const n=state.notes.size;
  $("#copyStatus").textContent="Saved "+name+" with "+(n?n+(n===1?" note":" notes"):"the notes cleared");
}

const NOTHING_OFF=new Set();
/* The text of a copy. By default the SHORT one: only the fields left ticked in the
   metadata panel's short-copy row — the heading included, since the title and
   subtitle can be unticked there too. With no heading there is nothing to indent
   under, so the fields sit at the margin instead; with nothing at all left, the
   record contributes no block.
   `full` ignores that choice. The F button needs it: its plain-text flavor is what
   a plain editor pastes, and it must carry the whole record rather than a copy
   narrowed for the other button — narrowed to nothing, in the limit. */
function blocksText(records,full,alwaysNote){
  const ctx=cardCtx(), off=full?NOTHING_OFF:state.shortOff;
  const wantT=!off.has(ctx.tf), wantS=ctx.sub!==null&&!off.has(ctx.sub);
  const nk=NOTE_LABEL(), wantN=alwaysNote||!off.has(nk);
  return records.map(r=>{
    const d=recordRows(r,ctx);
    const head=(wantT?(d.tv==null?"(untitled)":textScalar(d.tv)):"")+
      ((wantS&&d.sub!==undefined)?(wantT?" — ":"")+textScalar(d.sub):"");
    const lines=head?[head]:[], pad=head?"  ":"";
    /* the picture is a link in text; a data: URI is named, never dumped */
    if(d.img!==null && !off.has(d.imgKey)) lines.push(pad+d.imgKey+": "+
      (/^data:/i.test(String(d.img).trim())?"(embedded image)":String(d.img).trim()));
    for(const {k,v} of d.rows) if(!off.has(k)) lines.push(pad+k+": "+textValue(v,pad));
    for(const {k,v,n} of d.nested) if(!off.has(k)){ const t=textValue(v,pad);
      lines.push(pad+k+" ("+n+"):"+(t[0]==="\n"?"":" ")+t); }
    /* Last, and the one value whose own line breaks are kept: a note is written by
       hand, so its shape is the reader's rather than the data's. Continuation lines
       are indented to sit under the first. */
    const note=wantN?noteOf(r).trim():"";
    if(note) lines.push(pad+nk+": "+
      note.replace(/\r?\n/g,"\n"+pad+" ".repeat(nk.length+2)));   // hanging, under the value
    return lines.join("\n");
  }).filter(b=>b).join("\n\n");
}
const selectionText = full => blocksText(selectedRecords(),full,false);

/* ---------- copy as HTML ----------
   For pasting into a mail composer. Mail clients drop <style> blocks and class
   attributes, so every rule is written inline on the element it applies to, and
   the card's two-column rows become a table — the one layout they all still
   honor. Nested fields are expanded: an email cannot hold a collapsible section.
   The card layout is used whatever the View setting, since a mail column is
   narrow. */
const M={
  wrap:"font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1d2330",
  card:"border:1px solid #e3e6ea;border-radius:11px;padding:12px 13px;margin:0 0 12px 0;background:#ffffff",
  h:"margin:0 0 8px 0;font-size:15px;font-weight:700",
  sub:"font-weight:500;color:#6b7280;font-size:12px",
  tbl:"border-collapse:collapse;width:100%",
  k:"width:140px;color:#6b7280;font-size:12px;vertical-align:top;padding:2px 8px 2px 0;border-top:1px solid #f1f3f5",
  v:"vertical-align:top;padding:2px 0;border-top:1px solid #f1f3f5;word-break:break-word",
  link:"color:#2563eb;text-decoration:none",
  muted:"color:#6b7280",
  chip:"display:inline-block;background:#eef1f5;border-radius:999px;padding:1px 8px;margin:1px 2px 1px 0;font-size:12px",
  ltk:"display:block;color:#6b7280;font-size:12px;margin:7px 0 1px",
  ltv:"line-height:1.55;word-break:break-word",
  pub:"padding:3px 0;font-size:13px",
  j:"color:#6b7280;font-size:12px"
};
const mailLink=(href,text,note)=>'<a href="'+esc(href)+'"'+(note?' title="'+esc(note)+'"':"")+
  ' style="'+M.link+'">'+esc(text)+'</a>';
function mailScalar(v,key){                      // renderScalar, with the styles inlined
  if(typeof v==="boolean") return '<span style="font-weight:600;color:'+(v?"#15803d":"#b91c1c")+'">'+v+'</span>';
  const s=String(v), img=isImageURL(s);
  if(/^https?:\/\//i.test(s)||img){
    const label=img||s.length>URL_TEXT_MAX;
    return mailLink(s, label?linkLabel(s,key):s, label&&!/^data:/i.test(s)?s:null);
  }
  const hit=autoLinkFor(s,key);
  return hit ? mailLink(hit.url,s,linkNote(hit)) : esc(s);
}
function mailObjLine(o,key){
  const t=o.title||o.name||null;
  if(t){ const bits=[]; for(const k of ["journal","venue","source","year","date"]) if(o[k]!=null) bits.push(esc(String(o[k])));
    return '<div style="'+M.pub+'">'+esc(String(t))+(bits.length?' <span style="'+M.j+'">— '+bits.join(", ")+'</span>':"")+'</div>'; }
  return '<div style="'+M.pub+'">'+Object.entries(o).map(([k,v])=>esc(k)+": "+
    (v!==null&&typeof v==="object"?esc(JSON.stringify(v)):mailScalar(v,k))).join("; ")+'</div>';
}
function mailValue(v,key){
  if(v===null||v===undefined) return '<span style="'+M.muted+'">—</span>';
  if(Array.isArray(v)){
    if(!v.length) return '<span style="'+M.muted+'">[]</span>';
    return v.map(x=>(x!==null&&typeof x==="object") ? mailObjLine(x,key)
      : '<span style="'+M.chip+'">'+mailScalar(x,key)+'</span>').join("");
  }
  if(typeof v==="object")
    return '<table style="'+M.tbl+'">'+Object.entries(v).map(([k,x])=>
      '<tr><td style="'+M.k+'">'+esc(k)+'</td><td style="'+M.v+'">'+mailValue(x,k)+'</td></tr>').join("")+'</table>';
  return mailScalar(v,key);
}
function selectionHTML(){
  const ctx=cardCtx();
  return '<div style="'+M.wrap+'">'+selectedRecords().map(r=>{
    const d=recordRows(r,ctx), tv=d.tv;
    const th=(tv!=null&&typeof tv!=="object")?autoLinkFor(tv,ctx.tf):null;
    const t=(tv==null) ? '<span style="'+M.muted+'">(untitled)</span>'
          : th ? '<a href="'+esc(th.url)+'" style="color:inherit;text-decoration:none">'+esc(String(tv))+'</a>'
          : esc(String(tv));
    const head='<div style="'+M.h+'">'+t+
      (d.sub===undefined?"":' <span style="'+M.sub+'">'+esc(String(d.sub))+'</span>')+'</div>';
    /* the thumbnail shares the top line with the heading, as it does on the card */
    const top=d.img===null ? head
      : '<table style="'+M.tbl+'"><tr><td style="vertical-align:top">'+head+'</td>'+
        '<td style="vertical-align:top;width:72px;padding-left:10px"><img src="'+esc(String(d.img))+
        '" width="72" height="72" alt="" style="width:72px;height:72px;border-radius:10px;'+
        'object-fit:cover;object-position:50% 0%;display:block"></td></tr></table>';
    let rows="", lt="", nest="";
    for(const {k,v,long} of d.rows){
      if(long){ lt+='<div><span style="'+M.ltk+'">'+esc(k)+':</span><div style="'+M.ltv+'">'+mailValue(v,k)+'</div></div>'; continue; }
      rows+='<tr><td style="'+M.k+'">'+esc(k)+'</td><td style="'+M.v+'">'+mailValue(v,k)+'</td></tr>'; }
    for(const {k,v,n} of d.nested)
      nest+='<div><span style="'+M.ltk+'">'+esc(k)+' ('+n+')</span><div>'+mailValue(v,k)+'</div></div>';
    /* the note keeps its line breaks here too — pre-wrap is the one white-space
       value mail clients honour reliably */
    const note=noteOf(r).trim();
    if(note) nest+='<div><span style="'+M.ltk+'">'+esc(NOTE_LABEL())+'</span>'+
      '<div style="'+M.ltv+';white-space:pre-wrap">'+esc(note)+'</div></div>';
    return '<div style="'+M.card+'">'+top+(rows?'<table style="'+M.tbl+'">'+rows+'</table>':"")+lt+nest+'</div>';
  }).join("")+'</div>';
}

/* ---------- the clipboard ----------
   Both flavors go on at once and the paste target picks: a mail composer takes the
   HTML, a plain-text field the text. ClipboardItem needs a secure context — https,
   localhost, and file://, which browsers also count as trustworthy — so the one
   context without it is plain http:// to another host. Hence the fallback, which
   reaches the same two flavors through a copy event. */
async function copyOut(text,html){
  if(navigator.clipboard&&window.ClipboardItem&&window.isSecureContext){
    try{
      const items={"text/plain":new Blob([text],{type:"text/plain"})};
      if(html) items["text/html"]=new Blob([html],{type:"text/html"});
      await navigator.clipboard.write([new ClipboardItem(items)]);
      return true;
    }catch(e){}                                  // denied or unsupported: fall through
  }
  return legacyCopy(text,html);
}
function legacyCopy(text,html){
  /* execCommand copies the SELECTION, so there has to be one; the copy handler then
     replaces whatever the DOM would have produced with the two strings we built. */
  const box=document.createElement("div");
  box.setAttribute("contenteditable","true");
  box.style.cssText="position:fixed;left:-9999px;top:0;white-space:pre-wrap";
  if(html) box.innerHTML=html; else box.textContent=text;
  document.body.appendChild(box);
  const sel=getSelection(), range=document.createRange();
  range.selectNodeContents(box); sel.removeAllRanges(); sel.addRange(range);
  const onCopy=e=>{ e.clipboardData.setData("text/plain",text);
    if(html) e.clipboardData.setData("text/html",html); e.preventDefault(); };
  document.addEventListener("copy",onCopy);
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  document.removeEventListener("copy",onCopy);
  sel.removeAllRanges(); box.remove();
  return ok;
}
/* the clipboard is silent about success, so the button says it */
function flash(btn,ok,what){
  btn.classList.remove("ok","bad");
  void btn.offsetWidth;                          // restart the flash on a second click
  btn.classList.add(ok?"ok":"bad");
  setTimeout(()=>btn.classList.remove("ok","bad"),900);
  /* the same news in words: a colour is no use to a screen reader, and green
     against red is exactly the pair most colourblind readers cannot separate */
  $("#copyStatus").textContent=(ok?"Copied ":"Could not copy ")+what;
}
async function copySelection(btn,full){
  const n=state.selected.size; if(!n) return;
  const okd=await copyOut(selectionText(full), full?selectionHTML():null);
  flash(btn, okd, n+(n===1?" record":" records")+(full?", with formatting":" as text"));
}

/* ---------- the filters, in words ----------
   What is on screen and why, for pasting into a note or a message beside the
   records themselves. Built from liveTerms(), so a filter suspended because its
   field is switched off is absent here exactly as it is absent from the result —
   the description can only ever describe what actually applied. */
function termText(k,f){
  const bits=[...f.vals];                        // values within a field are OR-ed
  if(f.present) bits.push("not missing");
  if(f.missing) bits.push("missing");
  return k+": "+bits.join(" or ");
}
const setText = terms => terms.map(([k,f])=>termText(k,f)).join(", and ");
function describeFilters(){
  const live=liveTerms(), cs=state.clauses;
  const out=[(state.fileName||"(no file loaded)")+" — "+
    state.filtered.length.toLocaleString()+" of "+state.records.length.toLocaleString()+" records"];
  if(state.search) out.push("", "search: "+state.search);
  if(!cs.length){
    if(live.length) out.push("", setText(live).split(", and ").join("\n"));
    else if(!state.search) out.push("", "no filters — every record is shown");
  }else{
    /* each saved set, then the panels as one more — which is how they combine */
    out.push("", "any of these sets:");
    cs.forEach((c,i)=>{
      const hits=state.clauseHits&&state.clauseHits[i], uniq=state.clauseUniq&&state.clauseUniq[i];
      out.push("  "+(i+1)+". "+setText(c.terms)+
        (hits==null?"":"   ("+hits.toLocaleString()+" records, "+uniq.toLocaleString()+" only here)"));
    });
    if(live.length) out.push("  "+(cs.length+1)+". "+setText(live)+"   (the panels, as they stand)");
  }
  return out.join("\n");
}

/* ---------- events ---------- */
$("#filters").addEventListener("toggle",e=>{ if(e.target.classList.contains("ffield")&&e.target.open) renderFieldBody(e.target); },true);
$("#filters").addEventListener("change",e=>{
  const cb=e.target; if(cb.type!=="checkbox") return;
  const k=cb.dataset.field, f=state.filters[k];
  if(cb.dataset.kind==="missing") f.missing=cb.checked;
  else if(cb.dataset.kind==="present") f.present=cb.checked;
  else { if(cb.checked) f.vals.add(cb.dataset.val); else f.vals.delete(cb.dataset.val); }
  markActive(cb.closest(".ffield")); renderClauses(); state.page=0; apply();
});

/* save the panels as a clause and clear them for the next set */
$("#orFilter").onclick=()=>{
  const spec=liveClause(); if(!spec) return;
  state.clauses.push(makeClause(spec));
  clearLiveFilters();
  renderClauses(); state.page=0; apply();
};
$("#copyFilters").onclick=async e=>{
  const btn=e.currentTarget;
  flash(btn, await copyOut(describeFilters(), null), "the filter description");
};
$("#clauses").addEventListener("click",e=>{
  const b=e.target.closest("button[data-clause]"); if(!b) return;
  state.clauses.splice(+b.dataset.clause,1);
  renderClauses(); state.page=0; apply();
});
/* Ticking a box must not re-render the page — that would close every expander the
   reader has opened — so it edits the one card in place. */
$("#cards").addEventListener("change",e=>{
  const cb=e.target; if(!cb.classList||!cb.classList.contains("selbox")) return;
  const r=state.pageItems[+cb.dataset.idx];
  if(cb.checked) state.selected.add(r); else state.selected.delete(r);
  const card=cb.closest(".card"); if(card) card.classList.toggle("sel",cb.checked);
  renderSelBar();
});
/* Double-click a box to tick every card on the page — and again to clear them, the
   way double-clicking an expander opens a field on every card. The two clicks of
   the double-click cancel each other out on the box you hit, so what is read here
   is the state you started from. */
$("#cards").addEventListener("dblclick",e=>{
  const hit=e.target.closest&&e.target.closest(".selbox"); if(!hit) return;
  const boxes=[...$("#cards").querySelectorAll(".selbox")];
  setPageSelection(!boxes.every(b=>b.checked));  // all ticked already -> clear them instead
});
/* typing a note: the card is not re-rendered — that would take the caret with it */
$("#cards").addEventListener("input",e=>{
  const ta=e.target; if(!ta.classList||!ta.classList.contains("note")) return;
  const r=state.pageItems[+ta.dataset.idx], t=ta.value;
  if(t.trim()) state.notes.set(r,t); else state.notes.delete(r);
  ta.classList.toggle("has",!!t.trim());
  state.notesDirty=true;
  growNote(ta); renderNoteBtn();
  const sn=$("#shortNote"); if(sn) renderMeta();   // the notes chip comes and goes with them
});
/* Two jobs, decided by whether there is anything to save. Nothing pending: it shows
   the boxes and hides them again. Something pending: it writes the file, and goes
   back to being a toggle once it has. */
$("#noteBtn").onclick=()=>{ if(notesPending()) downloadNotesJSON(); else setNotesOn(!state.notesOn); };
$("#noteCopy").onclick=e=>copyNotesText(e.currentTarget);
/* Highlight the card being written on: which box has the cursor is otherwise easy to
   lose on a wide grid. Delegated focusin/focusout rather than :has(), which the rest
   of the file also does without. */
$("#cards").addEventListener("focusin",e=>{
  const t=e.target; if(!t.classList||!t.classList.contains("note")) return;
  const c=t.closest(".card"); if(c) c.classList.add("noting");
});
$("#cards").addEventListener("focusout",e=>{
  const t=e.target; if(!t.classList||!t.classList.contains("note")) return;
  const c=t.closest(".card"); if(c) c.classList.remove("noting");
});

/* Tab down one column of the cards rather than through everything on them.
   From a select box it walks the select boxes — the record-picking pass — and Space
   ticks the one it lands on, as it does for any checkbox. Otherwise, while the note
   boxes are up, it walks those: writing notes down a page is the job at hand, and
   every link and control in between would take a turn. Escape steps out of either;
   the pointer reaches everything as usual, and with the notes hidden Tab is
   ordinary again. The guard dialog keeps its own tab order. */
document.addEventListener("keydown",e=>{
  if(!$("#guard").hidden) return;
  const a=document.activeElement, cl=a&&a.classList;
  const onBox=!!(cl&&cl.contains("selbox")), onNote=!!(cl&&cl.contains("note"));
  if(e.key==="Escape"&&(onBox||onNote)){ a.blur(); return; }
  if(e.key!=="Tab") return;
  const pick = onBox ? ".selbox" : (state.notesOn ? ".note" : null);
  if(!pick) return;
  const list=[...$("#cards").querySelectorAll(pick)];
  if(!list.length) return;
  e.preventDefault();
  const i=list.indexOf(a), n=list.length;
  list[i<0 ? (e.shiftKey?n-1:0) : (e.shiftKey?(i-1+n)%n:(i+1)%n)].focus();
});
$("#selPage").onchange=e=>setPageSelection(e.target.checked);
$("#selClear").onclick=clearSelection;
$("#copyShort").onclick=e=>copySelection(e.currentTarget,false);   // S: text, chosen fields
$("#copyFull").onclick=e=>copySelection(e.currentTarget,true);     // F: rich HTML, everything shown

$("#cards").addEventListener("toggle",e=>{
  const d=e.target; if(!d.classList.contains("cf")||!d.open) return;
  const body=d.querySelector(".cf-body"); if(body.dataset.rendered==="1") return;
  body.dataset.rendered="1";
  const k=d.dataset.field, v=val(state.pageItems[+d.dataset.idx],k);
  body.innerHTML=renderValue(v===undefined?null:v, k);
},true);
/* Double-click a nested field's triangle to open that field on every card of the
   page at once — and again to close them. The two clicks of the double-click
   cancel each other out on the one you hit, so counting here sees the state you
   started from. Bodies still render lazily: setting .open fires toggle. */
$("#cards").addEventListener("dblclick",e=>{
  const sum=e.target.closest("summary"); if(!sum) return;
  const d=sum.parentNode; if(!d.classList||!d.classList.contains("cf")) return;
  const f=d.dataset.field;
  const peers=[...$("#cards").querySelectorAll("details.cf")].filter(x=>x.dataset.field===f);
  const openAll=!peers.every(x=>x.open);        // all open already -> close them instead
  peers.forEach(x=>{ x.open=openAll; });
});

/* field on/off toggles — delegated, so renderMeta() can rebuild the rows freely */
$("#metaBody").addEventListener("change",e=>{
  const cb=e.target;
  /* the short-copy row changes nothing on screen — no apply(), just the URL */
  const sk=cb.dataset&&cb.dataset.shorttog;
  if(sk){
    if(cb.checked) state.shortOff.delete(sk); else state.shortOff.add(sk);
    cb.closest(".ftog").classList.toggle("off",!cb.checked);
    const sn=$("#shortNote"); if(sn) sn.textContent=shortNote();
    syncURL(); return;
  }
  const k=cb.dataset&&cb.dataset.fieldtog; if(!k) return;
  if(cb.checked) state.hidden.delete(k); else state.hidden.add(k);
  const chip=cb.closest(".ftog");                            // keep focus: no full re-render
  chip.classList.toggle("off",!cb.checked);
  chip.classList.toggle("susp",!cb.checked&&fieldActive(state.filters[k]));
  chip.title=chip.classList.contains("susp")?"its filter is suspended while the field is off":"";
  const n=$("#hidNote"); if(n) n.textContent=hiddenNote();
  const im=$("#imgNote"); if(im) im.innerHTML=imageNote();   // imageNote() escapes its parts
  /* the same field in the short-copy row below: switched off here, it is in no copy
     either, and saying so there is the point of that greying */
  for(const b of document.querySelectorAll("#metaBody [data-shorttog]"))
    if(b.dataset.shorttog===k){
      const c=b.closest(".ftog"); c.classList.toggle("gone",!cb.checked);
      c.title=cb.checked?"":"the field is switched off, so no copy shows it";
    }
  /* renderClauses() is the only writer of the OR button's disabled state, and
     suspending or reviving a filter is exactly what changes whether there is
     anything to save */
  renderClauses(); syncFieldUI(); apply();      // a suspended filter changes what matches
});
$("#metaBody").addEventListener("click",e=>{
  const s=e.target.closest("button[data-stog]");
  if(s){                                       // "none" takes the heading out as well
    const how=s.dataset.stog;
    /* the row's own list, the notes among them only when there are any, as the row
       offers them */
    const fields=state.scalarFields.concat(state.complexFields)
                     .concat(state.notes.size?[NOTE_LABEL()]:[]);
    state.shortOff.clear();
    if(how==="none") for(const k of fields) state.shortOff.add(k);
    /* Mirror: take the page's own field switches. What the cards show, the copy
       carries — and what is switched off up there is unticked here, so switching it
       back on later does not quietly put it into the copy as well. The heading
       fields and the notes are not switched off up there, so they stay in. */
    else if(how==="mirror") for(const k of fields) if(state.hidden.has(k)) state.shortOff.add(k);
    renderMeta(); syncURL(); return;
  }
  const b=e.target.closest("button[data-tog]"); if(!b) return;
  const list=b.dataset.group==="complex"?state.complexFields:state.scalarFields;
  const tf=titleField(), sub=subtitleField();
  for(const k of list){ if(k===tf||k===sub) continue;
    if(b.dataset.tog==="all") state.hidden.delete(k); else state.hidden.add(k); }
  renderMeta(); renderClauses(); syncFieldUI(); apply();
});

/* delegated: the selects are rebuilt whenever the cascade grows or shrinks */
$("#sortbox").addEventListener("change",e=>{
  const sel=e.target.closest("select[data-level]"); if(!sel) return;
  const i=+sel.dataset.level, o=sel.selectedOptions[0];
  if(!o||!o.hasAttribute("data-k")) state.sorts.length=i;   // "(none)" drops this level and those below
  else state.sorts[i]={k:o.value, desc:o.dataset.desc==="1", last:o.dataset.last==="1"};
  state.sortSig=null; state.page=0; apply();
});
/* Typing re-runs the whole pipeline — filter, sort, facets — over every record, so
   a long query would do it once per keystroke. Wait for a pause instead. The timer
   always fires (trailing edge), so the final keystroke can never be dropped. */
let searchTimer=null;
$("#globalSearch").addEventListener("input",e=>{
  const v=e.target.value.trim().toLowerCase();
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{ state.search=v; state.page=0; apply(); },
                         state.records.length>2000 ? 150 : 0);
});
/* the ▼ menu beside the search box: which of the three matching modes is in force.
   The box's tooltip states the rules of whichever mode is on. */
const SEARCH_TIPS={
  plain:'The whole query matches as one exact string — spaces and quotes included — anywhere in a field. The ▼ menu switches to word-by-word matching.',
  terms:'Words are OR-ed: a record is shown if any of them occurs in any field. Use "double quotes" for an exact phrase, spaces included — the way to require words to appear together. Words and "phrases" mix freely; each is one more OR alternative. The ▼ menu switches the other two modes on.',
  whole:'Words are OR-ed as above, but a word has to BE a whole field rather than occur in one: york matches a field that is exactly York, not one that mentions it. "Double quotes" hold a multi-word value together; in an array field each element counts as one whole value.'
};
function syncSearchTip(){ $("#globalSearch").title=SEARCH_TIPS[state.searchMode]; }
syncSearchTip();
$("#searchMenu").addEventListener("change",e=>{
  state.searchMode=e.target.value; $("#searchMenu").open=false;
  syncSearchTip(); state.page=0; apply();
});
/* a details element never closes itself: any click outside folds it */
document.addEventListener("click",e=>{ const m=$("#searchMenu"); if(m.open && !e.target.closest("#searchMenu")) m.open=false; });
$("#pageSize").addEventListener("change",e=>{ state.pageSize=e.target.value==="all"?"all":+e.target.value; state.page=0; apply(); });
$("#recordArray").addEventListener("change",async e=>{
  const key=e.target.value;
  if(!await notesLetGo("changing the record array")){ e.target.value=state.recordKey; return; }
  setRecordSource(key,false);
});
/* a field promoted to the heading or the card image stops being hidden — the two
   would contradict — which can also bring its filter panel back, hence apply() */
function pickField(sel,v){ state[sel]=v; state.hidden.delete(v); renderMeta(); renderClauses(); syncFieldUI(); apply(); }
$("#titleField").addEventListener("change",e=>pickField("titleSel",e.target.value));
$("#subField").addEventListener("change",e=>pickField("subSel",e.target.value));
$("#imageField").addEventListener("change",e=>pickField("imageSel",e.target.value));
$("#viewMode").addEventListener("change",e=>{ state.viewMode=e.target.value; renderCards(); syncURL(); });
$("#autoLink").addEventListener("change",e=>{ state.autoLink=e.target.value==="1"; renderMeta(); renderCards(); syncURL(); });
$("#first").onclick=()=>{state.page=0;apply()};
$("#prev").onclick=()=>{state.page--;apply()};
$("#next").onclick=()=>{state.page++;apply()};
$("#last").onclick=()=>{state.page=1e9;apply()};
$("#resetFilters").onclick=()=>{
  state.clauses=[];        // saved sets are filters too, so reset clears them as well
  clearLiveFilters();
  state.search=""; $("#globalSearch").value=""; state.page=0;
  renderClauses();
  renderMeta();            // no filters left to suspend, so clear those chip markers
  apply();
};
$("#collapseAll").onclick=()=>document.querySelectorAll(".ffield[open]").forEach(d=>d.open=false);

/* Fold the panel away. Default: open on a desktop, closed on a phone; crossing the
   breakpoint resets to that default, a click overrides it until the next crossing.
   Deliberately NOT in the URL — a shared link should not carry your screen width. */
const NARROW=matchMedia("(max-width:820px)");
function showSide(on){
  $(".app").classList.toggle("sidehidden",!on);
  $("#sideToggle").setAttribute("aria-expanded",on?"true":"false");
}
showSide(!NARROW.matches);
NARROW.addEventListener("change",e=>showSide(!e.matches));
$("#sideToggle").onclick=()=>showSide($(".app").classList.contains("sidehidden"));

/* ---------- guarding unsaved notes ----------
   Leaving the page can only ever raise the browser's own prompt — a page cannot put
   its own buttons in that dialog, so "download or discard" is not on offer there.
   Where it IS on offer is here: the actions the page performs itself, each of which
   would throw the notes away, since they belong to records that are about to go. */
let guardAnswer=null;
function askAboutNotes(what){
  if(!notesPending()) return Promise.resolve("go");
  const n=state.notes.size;
  $("#guardMsg").textContent = n
    ? n+(n===1?" note has":" notes have")+" not been saved, and "+what+
      " will discard "+(n===1?"it":"them")+"."
    : "The notes have been cleared and not saved, and "+what+" will discard the change.";
  $("#guard").hidden=false;
  $("#guardSave").focus();
  return new Promise(r=>{ guardAnswer=r; });
}
function answerGuard(a){ $("#guard").hidden=true; const r=guardAnswer; guardAnswer=null; if(r) r(a); }
$("#guardSave").onclick=()=>answerGuard("save");
$("#guardDiscard").onclick=()=>answerGuard("discard");
$("#guardCancel").onclick=()=>answerGuard("cancel");
$("#guard").addEventListener("keydown",e=>{ if(e.key==="Escape") answerGuard("cancel"); });
/* true if the caller may go ahead */
async function notesLetGo(what){
  const a=await askAboutNotes(what);
  if(a==="cancel") return false;
  if(a==="save") downloadNotesJSON();
  return true;                   // setRecordSource clears the notes either way
}
window.addEventListener("beforeunload",e=>{
  if(!notesPending()) return;
  e.preventDefault(); e.returnValue="";   // the wording is the browser's, not ours
});

function pickFile(){ $("#fileInput").click(); }
$("#loadBtn").onclick=pickFile; $("#emptyLoad").onclick=pickFile;
async function loadFromURL(url){
  url=(url||"").trim(); if(!url) return;
  if(!await notesLetGo("loading another file")) return;
  fetch(url,{cache:"no-store"})
    .then(res=>{ if(!res.ok) throw new Error("HTTP "+res.status+" "+res.statusText); return res.json(); })
    .then(data=>{ loadData(data,url); $("#urlInput").value=url; })
    .catch(err=>alert("Could not load JSON from URL:\n"+err.message+"\n\nThe server must permit cross-origin (CORS) requests."));
}
$("#urlLoadBtn").onclick=()=>loadFromURL($("#urlInput").value);
$("#urlInput").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); loadFromURL(e.target.value); } });
$("#emptyUrlLoad").onclick=()=>loadFromURL($("#emptyUrlInput").value);
$("#emptyUrlInput").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); loadFromURL(e.target.value); } });
async function readFile(f){
  if(!f) return;
  if(!await notesLetGo("loading another file")) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ loadData(JSON.parse(rd.result),f.name); }
                  catch(err){ alert("Could not read "+f.name+":\n"+err.message); } };
  rd.readAsText(f);
}
$("#fileInput").addEventListener("change",e=>readFile(e.target.files[0]));
const drop=$("#drop");
window.addEventListener("dragover",e=>{e.preventDefault();drop.style.display="flex"});
["dragleave","drop"].forEach(ev=>window.addEventListener(ev,e=>{ if(ev==="dragleave"&&e.relatedTarget) return; drop.style.display="none"; }));
window.addEventListener("drop",e=>{ e.preventDefault(); readFile(e.dataTransfer.files[0]); });

function showEmpty(why){
  $("#emptyState").style.display="block";
  const e=$("#emptyErr");
  e.textContent=why||""; e.style.display=why?"block":"none";
}
(async function(){
  const params=parseQuery(location.search);
  const file=params.one("file");          // no default — blank page until a file is given
  if(!file){ showEmpty(); return; }
  state.restoring=true;
  let loaded=false;
  try{
    const res=await fetch(file,{cache:"no-store"});
    if(!res.ok) throw new Error("the server answered "+res.status+(res.statusText?" "+res.statusText:""));
    loadData(await res.json(),file);       // builds default view (URL writes suppressed)
    loaded=true;
    if(/^https?:\/\//i.test(file)) $("#urlInput").value=file;   // reflect URL source
    restoreFromParams(params);             // rehydrate filters/search/display from the URL
  }catch(err){
    /* Two failures that deserve opposite treatment. If the data never arrived there
       is nothing to show, so say why rather than leaving a blank page that looks
       identical to having been given no link at all. If it arrived and only the view
       failed to rehydrate, the records are still good: keep them and lose the view,
       never the other way round. */
    if(!loaded){ state.restoring=false; showEmpty("Could not load "+file+" — "+err.message); return; }
    console.error("could not restore the view from the URL:",err);
  }
  state.restoring=false;
  apply();                                 // filter, render, and write the canonical URL
})();
