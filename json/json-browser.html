<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>JSON DB Viewer</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e3e6ea;
    --accent:#2563eb; --accent-soft:#e8f0fe; --chip:#eef1f5; --ok:#15803d; --no:#b91c1c;
    /* Three colours with one meaning each: green is notes, blue is the selection,
       orange is loading. Nothing else may borrow any of them. */
    --ok-soft:#d6f0dd; --ok-pale:#f3fbf6;    /* the notes' green, at ring and wash weight */
    --accent-lite:#60a5fa;                   /* the selection's blue, for a moment's confirmation */
    --ok-lite:#4ade80;                       /* and the notes' green at that same weight */
    --load:#ea580c; --load-alt:#d97706;      /* loading: the file itself, and by URL */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--bg)}
  a{color:var(--accent);text-decoration:none;word-break:break-all}
  a:hover{text-decoration:underline}
  .muted{color:var(--muted)}
  .app{display:grid;grid-template-columns:310px 1fr;grid-template-rows:auto 1fr;
       grid-template-areas:"top top" "side main";height:100vh}
  header.top{grid-area:top;background:var(--panel);border-bottom:1px solid var(--line);
       padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;z-index:5}
  header.top h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px}
  header.top .count{font-weight:600}
  aside.side{grid-area:side;background:var(--panel);border-right:1px solid var(--line);
       overflow:auto;padding:10px;display:flex;flex-direction:column}
  main.main{grid-area:main;overflow:auto;padding:14px}
  /* The panel folds away: on a phone a fixed 310px column would leave the records
     a sliver of the screen. Hidden, its grid column collapses to nothing. */
  .app.sidehidden{grid-template-columns:0 1fr}
  .app.sidehidden aside.side{display:none}
  #sideToggle{font-size:14px;line-height:1;padding:5px 9px;flex:none}
  /* Green throughout — it is the notes' button, and green is the notes' colour — and
     a true toggle: outlined while the boxes are hidden, filled while they are up.
     The darker green is only ever a hover, in both states, so it never reads as a
     third one. The download job changes the icon, not the colour. */
  #noteBtn{flex:none;padding:5px 8px;line-height:0;
           background:#fff;border-color:var(--ok);color:var(--ok)}
  #noteBtn:hover{background:var(--ok-pale);border-color:#166534;color:#166534}
  #noteBtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;
               stroke-linecap:round;stroke-linejoin:round;display:block}
  #noteBtn .ico-save{display:none}
  #noteBtn.on{background:var(--ok);border-color:var(--ok);color:#fff}
  #noteBtn.on:hover{background:#166534;border-color:#166534}
  /* unsaved notes: it stops being a toggle and becomes the way to write the file */
  #noteBtn.dirty .ico-note{display:none}
  #noteBtn.dirty .ico-save{display:block}
  @media (max-width:820px){
    /* Stack instead of squeeze: the panel becomes a band above the records. Both
       selectors, or .app.sidehidden's two-column rule would outrank this one and
       leave the single-column areas disagreeing with the columns. */
    .app, .app.sidehidden{grid-template-columns:1fr;grid-template-areas:"top" "side" "main";
       height:auto;min-height:100vh}
    aside.side{border-right:none;border-bottom:1px solid var(--line);max-height:70vh}
    main.main{overflow:visible}
    header.top h1{font-size:14px}
  }
  @media (max-width:520px){ #sideToggle .lbl{display:none} }
  input,select,button{font:inherit;color:inherit}
  .ctl{display:flex;gap:6px;align-items:center}
  .ctl.grow{flex:1 1 auto;min-width:200px;position:relative}
  /* room on the right for the ▼ that lives inside the box; WebKit's native clear ✕
     respects the padding, so the two do not collide */
  .ctl.grow input[type=search]{width:100%;padding-right:30px}
  /* the ▼ search-options menu: a details, so open/close needs no state of its own.
     It overlays the input's right edge, reading as the input's own dropdown arrow;
     the panel hangs just below it */
  .smenu{position:absolute;right:5px;top:50%;transform:translateY(-50%)}
  /* no chip, no border: the glyph alone, drawn big and dark enough to be seen
     against the box it sits in */
  .smenu>summary{list-style:none;cursor:pointer;padding:0 4px;user-select:none;
                 color:var(--ink);font-size:12px;line-height:1}
  .smenu>summary::-webkit-details-marker{display:none}
  .smenu>summary:hover,.smenu[open]>summary{color:var(--accent)}
  .smenu-body{position:absolute;right:0;top:calc(100% + 7px);z-index:20;background:#fff;
              border:1px solid var(--line);border-radius:9px;padding:9px 11px;
              box-shadow:0 4px 14px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:7px;
              font-size:12px;white-space:nowrap}
  .smenu-body label{display:flex;gap:7px;align-items:center;cursor:pointer}
  .smenu-body input{margin:0;accent-color:var(--accent)}
  input[type=search],input[type=url],input.fsearch{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff;min-width:160px}
  select,button{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff;cursor:pointer}
  button:hover,select:hover{border-color:#c7ccd3}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pager{display:flex;gap:4px;align-items:center}
  .pager button{padding:5px 9px}
  .pager .pg{padding:0 6px;color:var(--muted)}
  /* the selection bar: last in the header, so it takes the top right and the search
     box — the only flexible item — gives up the width for it */
  .selbar{display:flex;gap:4px;align-items:center;margin-left:auto}
  .selbar[hidden]{display:none}       /* .selbar's display would otherwise outrank [hidden] */
  .selcount{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .selpage{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);
           cursor:pointer;user-select:none;white-space:nowrap}
  .selpage input{margin:0;accent-color:var(--accent);cursor:pointer}
  /* announced, never shown: the visible signal is the button's own flash */
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .selclear{padding:3px 8px;line-height:1.15;color:var(--muted)}
  .selclear:hover{color:var(--no)}
  .copybtn{padding:4px 8px;display:inline-flex;align-items:center}
  .copybtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;
               stroke-linejoin:round;pointer-events:none}
  /* opaque, so the sheet behind stops at this one's edge and the two read as a stack */
  .copybtn svg .sheet{fill:var(--accent)}
  /* centred in the front sheet: the letter is what tells the two buttons apart */
  .copybtn svg text{stroke:none;fill:currentColor;font-size:8.5px;font-weight:700}
  /* a moment's confirmation — the clipboard gives no other sign it worked. A lighter
     shade of the selection's own blue, never green: green belongs to the notes */
  .copybtn.ok{background:var(--accent-lite);border-color:var(--accent-lite)}
  .copybtn.ok svg .sheet{fill:var(--accent-lite)}
  .copybtn.bad{background:var(--no);border-color:var(--no)}
  .copybtn.bad svg .sheet{fill:var(--no)}
  /* Its neighbour, the other half of the pair: the S and F copies exactly — filled,
     white strokes, the front sheet in the button's own colour so the letter reads as
     cut out of it — but in the notes' green, and up only once there is something to
     copy. Copying changes nothing, so it never carries the unsaved state. Its
     confirming flash is that same green gone light, never the selection's blue: a
     button does not change colour on being pressed. Failure stays red, which belongs
     to no one of the three.
     The two sit in a group of their own, spaced like the pager's arrows and the
     selection bar's buttons; the header's own wider gap separates group from group. */
  .notebar{display:flex;gap:4px;align-items:center}
  .notecopy{background:var(--ok);border-color:var(--ok);color:#fff}
  .notecopy svg .sheet{fill:var(--ok)}
  .notecopy.ok{background:var(--ok-lite);border-color:var(--ok-lite)}
  .notecopy.ok svg .sheet{fill:var(--ok-lite)}
  /* the darker green is the hover here as everywhere, and only ever the hover: while
     the flash is on, it is the flash that shows */
  .notecopy:not(.ok):not(.bad):hover{background:#166534;border-color:#166534}
  .notecopy:not(.ok):not(.bad):hover svg .sheet{fill:#166534}
  /* .copybtn is inline-flex, which would outrank the attribute's own display:none */
  .notecopy[hidden]{display:none}
  details.meta{margin-bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  details.meta>summary{cursor:pointer;padding:9px 12px;font-weight:600}
  details.meta>summary .mhint{font-weight:500;font-size:12px;color:var(--muted)}
  .metabody{padding:4px 12px 12px;display:grid;grid-template-columns:1fr;gap:2px}
  .metaload{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .metaload input[type=url]{flex:1 1 240px;min-width:120px}
  /* field on/off toggles */
  .ftog{display:inline-flex;gap:5px;align-items:center;background:var(--chip);border-radius:999px;
        padding:1px 9px 1px 6px;margin:1px 3px 1px 0;font-size:12px;cursor:pointer;user-select:none}
  .ftog:hover{background:#e3e7ec}
  .ftog input{margin:0}
  .ftog.off{opacity:.6;text-decoration:line-through}
  .ftog.fixed{cursor:default;background:var(--accent-soft);color:var(--muted)}
  .ftog.susp{color:var(--accent);opacity:.85}   /* off, but still holds a filter */
  .ftog.gone{opacity:.4}                        /* the field is off everywhere, so this says nothing */
  /* the copy glyph at label size — on the short-copy row, and on the button that
     copies the filters in words. The front sheet takes the panel colour, so the one
     behind stops at its edge exactly as it does on the blue buttons. */
  .ico{width:15px;height:15px;fill:none;stroke:var(--accent);stroke-width:1.7;
       stroke-linejoin:round;vertical-align:-3px}
  .metabody .ico{margin-right:5px}
  .ico .sheet{fill:var(--panel)}
  .ico text{stroke:none;fill:var(--accent);font-size:8.5px;font-weight:700}
  .icobtn{display:inline-flex;align-items:center;padding:2px 7px}
  /* The filter description is neither a selection nor a note, so it takes neither
     colour — an ordinary button. Its confirmation stays quiet too: the glyph darkens
     against a grey the panel already uses, rather than the button turning a colour
     it has no business wearing. A failure is the one thing worth shouting.
     The short-copy row's mirror wears the same grey: both are plain buttons carrying
     the copy glyph, and the accent belongs to the S the row is labelled with. */
  #copyFilters .ico,.togacts .icobtn .ico{stroke:var(--muted)}
  #copyFilters:hover .ico,.togacts .icobtn:hover .ico{stroke:var(--ink)}
  .mini.ok{background:var(--chip);border-color:#c7ccd3}
  .mini.bad{background:var(--no);border-color:var(--no)}
  /* by id, or the resting #copyFilters rule above outranks these and nothing changes */
  #copyFilters.ok .ico{stroke:var(--ink)}
  #copyFilters.ok .ico .sheet{fill:var(--chip)}
  #copyFilters.bad .ico{stroke:#fff}
  #copyFilters.bad .ico .sheet{fill:var(--no)}
  .togacts{display:inline-flex;gap:3px;margin-right:8px;vertical-align:1px}
  .togacts .mini{padding:1px 6px;font-size:11px}
  .side h2{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:10px 4px 6px}
  .ffield{border:1px solid var(--line);border-radius:8px;margin-bottom:7px;overflow:hidden;background:#fff}
  .ffield>summary{cursor:pointer;padding:7px 9px;font-weight:600;display:flex;justify-content:space-between;gap:6px;align-items:center}
  .ffield>summary .n{color:var(--muted);font-weight:500;font-size:12px}
  .ffield[data-active="1"]>summary{background:var(--accent-soft)}
  .fbody{padding:6px 9px;border-top:1px solid var(--line)}
  .fbody .row1{display:flex;gap:6px;margin-bottom:6px}
  .miss-row{display:flex;gap:12px;padding:2px 2px 6px;border-bottom:1px dashed var(--line);margin-bottom:5px}
  .miss-row label{display:flex;gap:5px;align-items:center;cursor:pointer;font-size:12px}
  .miss-row .vc{color:var(--muted)}
  .fbody .vals{max-height:230px;overflow:auto;display:flex;flex-direction:column;gap:1px}
  .vrow{display:flex;gap:6px;align-items:center;padding:1px 2px;border-radius:4px}
  .vrow:hover{background:var(--chip)}
  .vrow label{flex:1;display:flex;gap:6px;align-items:center;cursor:pointer;min-width:0}
  .vrow .vtxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vrow .vc{color:var(--muted);font-size:12px;flex:none}
  .mini{font-size:12px;padding:2px 6px}
  .side .actions{display:flex;gap:6px;margin:4px 4px 6px}
  .side .actions .ortip{display:flex}   /* transparent wrapper: no inline leading of its own */
  .sortbox{margin:0 4px 2px}
  .sortbox select{width:100%}
  .sortbox .slev+.slev{margin-top:3px}      /* each further level steps in a little */
  .sortbox .slev1{margin-left:12px}
  .sortbox .slev2{margin-left:24px}
  /* saved filter sets, OR-ed with each other and with whatever is in the panels */
  #clauses{margin:0 4px 6px}
  #clauses .chead{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:2px 0 3px}
  .clause{display:flex;gap:6px;align-items:flex-start;background:var(--accent-soft);
          border:1px solid #d6e2fb;border-radius:8px;padding:4px 6px;margin-bottom:4px;font-size:12px}
  .clause+.clause{margin-top:-1px}
  .clause .cbits{flex:1 1 auto;min-width:0;line-height:1.4;word-break:break-word}
  .clause .ck{color:var(--muted)}
  .clause .cand{color:var(--muted);font-style:italic}
  .clause .cnums{flex:none;display:flex;gap:7px;padding-top:1px;color:var(--muted);
                 font-variant-numeric:tabular-nums}
  .clause .cdel{font-weight:600}          /* what removing it would cost */
  .clause .cx{flex:none;border:none;background:none;color:var(--muted);cursor:pointer;
              font-size:13px;line-height:1;padding:1px 3px;border-radius:4px}
  .clause .cx:hover{background:#fff;color:var(--no)}
  /* pointer-events:none lets the hover land on .ortip instead, so the help tooltip
     still appears while the button is disabled (it ignores clicks either way) */
  #orFilter:disabled{opacity:.45;cursor:default;pointer-events:none}
  /* options block */
  .opts{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}
  .opts label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
  .opts select{width:100%}
  .spacer{flex:1}
  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .grid.full{grid-template-columns:1fr}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;
        padding:12px 13px 26px;box-shadow:0 1px 2px rgba(16,24,40,.04);position:relative}
  /* The select box sits in the strip the extra bottom padding reserves, so it lands
     in the same corner in both views without adding a row of its own. */
  .selbox{position:absolute;right:11px;bottom:8px;width:15px;height:15px;margin:0;
          cursor:pointer;accent-color:var(--accent)}
  .selbox:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  /* the card being written on, washed in the notes' own green — after .sel, so a
     selected card still shows which one has the cursor in it */
  .card.noting{background:var(--ok-pale);border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
  /* A line of its own, the full width of the card and below everything else, so the
     select box keeps its corner however tall the note grows. One line to start with;
     the height is set from its own scrollHeight as it fills. */
  .note{display:block;width:100%;margin-top:9px;font:inherit;font-size:13px;color:inherit;
        border:1px solid var(--ok);border-radius:7px;padding:4px 7px;background:#fff;
        resize:none;overflow:hidden;line-height:1.4}
  .note:focus{outline:none;box-shadow:0 0 0 2px var(--ok-soft)}
  .note.has{background:#fbfefb}
  /* image field: one square thumbnail per record, same size everywhere, scaled to
     the viewport. It shares the top line with the heading, pinned to the right —
     so nothing sits above the title and every row underneath is full width. */
  .cardhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
  .cardhead>h3{flex:1 1 auto;min-width:0;margin-bottom:0}
  .cardhead+.kv{border-top:none}          /* the head is a div, so :first-of-type misses */
  .cardimg{flex:0 0 auto;display:block;width:clamp(43px,7.3vw,80px);aspect-ratio:1/1;
           border-radius:10px;overflow:hidden;background:var(--chip)}
  /* cover-crop anchored to the top: a portrait keeps the head, not the midriff.
     Only the vertical component bites — a wide image has no vertical overflow,
     so it still crops evenly left/right. */
  .cardimg img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 0%}
  .card h3{margin:0 0 8px;font-size:15px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .card h3 .sub{font-weight:500;color:var(--muted);font-size:12px}
  .kv{display:grid;grid-template-columns:140px 1fr;gap:8px;padding:2px 0;border-top:1px solid #f1f3f5}
  .kv:first-of-type{border-top:none}
  .kv .k{color:var(--muted);font-size:12px;word-break:break-word}
  .kv .v{min-width:0;word-break:break-word}
  /* full-width view: inline-wrapped fields to use horizontal space */
  .grid.full .card .kvwrap{display:flex;flex-wrap:wrap;gap:6px 18px}
  .grid.full .card .kv{grid-template-columns:none;display:flex;gap:6px;border-top:none;padding:1px 0;align-items:baseline}
  .grid.full .card .kv .k::after{content:":"}
  .chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 8px;margin:1px 2px 1px 0;font-size:12px}
  /* every link the viewer renders — a resolved identifier or a URL from the data —
     looks the same: accent colour with a dotted underline that solidifies on hover */
  a.vlink{border-bottom:1px dotted currentColor}
  a.vlink:hover{text-decoration:none;border-bottom-style:solid}
  .card h3 a.vlink{color:inherit}          /* a linked heading still reads as a heading */
  .bool{font-weight:600}.b-true{color:var(--ok)}.b-false{color:var(--no)}
  details.cf{margin:3px 0;border-top:1px solid #f1f3f5;padding-top:3px}
  details.cf>summary{cursor:pointer;color:var(--accent);font-size:12px;user-select:none}
  /* A long text field: teaser beside the collapsed triangle, full-width prose when
     open. The teaser is one line, clipped — if it wrapped, hiding it on open would
     shrink the summary under the pointer and swallow the second click of a
     double-click. Same height open or closed. */
  details.cf.txt>summary .peek{color:var(--muted);margin-left:6px;display:inline-block;
        max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  details.cf.txt[open]>summary .peek{display:none}
  /* Prose runs the full width of its container and flows as one paragraph: line
     breaks in the source are whitespace like any other, not layout. */
  .cf.txt .cf-body{line-height:1.55}
  /* the same text printed in place, for the full-width view */
  .lt{margin-top:7px}
  .lt-k{display:block;color:var(--muted);font-size:12px;margin-bottom:1px}
  .lt-k::after{content:":"}
  .lt-v{line-height:1.55;word-break:break-word}
  .cf-body{padding:6px 0 2px}
  .pub{padding:3px 0;border-bottom:1px dashed #eceef1;font-size:13px}
  .pub:last-child{border-bottom:none}
  .pub .j{color:var(--muted);font-size:12px}
  .obj{display:grid;gap:1px}
  #drop{position:fixed;inset:0;background:rgba(37,99,235,.08);border:3px dashed var(--accent);
        display:none;align-items:center;justify-content:center;font-size:20px;color:var(--accent);z-index:20}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .empty button{margin-top:10px}
  .empty .loaders{display:flex;flex-direction:column;gap:8px;max-width:320px;margin:14px auto 0;text-align:left}
  .empty .loaders button{margin-top:0}
  /* why the file named in ?file= never arrived — the alternative is a blank page
     that looks the same whether the link was wrong or no link was given at all */
  .loaderr{max-width:460px;margin:10px auto 0;color:var(--no);word-break:break-word}
  /* the notes guard: the one place the choice can actually be offered */
  .guard{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;
         align-items:center;justify-content:center;z-index:30;padding:16px}
  .guard[hidden]{display:none}
  .gbox{background:var(--panel);border-radius:12px;padding:18px 20px;max-width:440px;
        box-shadow:0 12px 40px rgba(16,24,40,.25)}
  .gmsg{margin-bottom:14px;line-height:1.5}
  .gacts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  /* Loading is a job of its own, so it takes a colour of its own: orange, borrowed
     from neither the selection nor the notes. Two shades, one per way in — the
     deeper orange for the file, the amber for the URL — so the pair is told apart
     by hue and not by reading the labels. The darker step is only ever a hover.
     Both places that load wear the same two, so the rule holds off the empty
     screen as well as on it. */
  #emptyLoad,#loadBtn{background:var(--load);border-color:var(--load);color:#fff}
  #emptyLoad:hover,#loadBtn:hover{background:#c2410c;border-color:#c2410c}
  #emptyUrlLoad,#urlLoadBtn{background:var(--load-alt);border-color:var(--load-alt);color:#fff}
  #emptyUrlLoad:hover,#urlLoadBtn:hover{background:#b45309;border-color:#b45309}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button id="sideToggle" aria-expanded="true" aria-controls="side"
            title="Show or hide sort, filters and display options">☰<span class="lbl"> Filters</span></button>
    <h1>JSON DB Viewer</h1>
    <span id="fileName" class="muted"></span>
    <span class="ctl grow">
      <input type="search" id="globalSearch" placeholder="Search all fields…">
      <details class="smenu" id="searchMenu">
        <summary title="How the search box matches">▼</summary>
        <div class="smenu-body">
          <label><input type="radio" name="searchMode" value="plain" checked> exact text — the whole query as one string</label>
          <label><input type="radio" name="searchMode" value="terms"> any word — OR-ed, "quotes" for exact phrases</label>
          <label><input type="radio" name="searchMode" value="whole"> whole field — any word, matching a field entirely</label>
        </div>
      </details>
    </span>
    <span class="count"><span id="resCount">0</span> records</span>
    <span class="pager">
      <button id="first">«</button><button id="prev">‹</button>
      <span class="pg" id="pgInfo">–</span>
      <button id="next">›</button><button id="last">»</button>
    </span>
    <!-- appears only while something is selected; the search box gives up the width.
         S is the short copy — plain text, and only the fields picked in the metadata
         panel. F is the full one — every field the card shows, as rich HTML. -->
    <span class="selbar" id="selbar" hidden>
      <!-- what double-clicking a select box does, for the keyboard and for touch,
           where there is no double-click at all -->
      <label class="selpage" title="Select every card on this page, or clear them">
        <span>page</span><input type="checkbox" id="selPage">
      </label>
      <span class="selcount" id="selCount" aria-live="polite"></span>
      <button class="selclear" id="selClear" title="Clear the selection">✕</button>
      <button class="primary copybtn" id="copyShort"
              title="Short copy — the selected records as text, with the fields chosen under Metadata">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="8.5" y="2.5" width="12.5" height="15.5" rx="2.5"/>
          <rect class="sheet" x="3" y="6" width="12.5" height="15.5" rx="2.5"/>
          <text x="9.25" y="16.8" text-anchor="middle">S</text>
        </svg>
      </button>
      <button class="primary copybtn" id="copyFull"
              title="Full copy — every field shown, as rich HTML to paste into an email">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="8.5" y="2.5" width="12.5" height="15.5" rx="2.5"/>
          <rect class="sheet" x="3" y="6" width="12.5" height="15.5" rx="2.5"/>
          <text x="9.25" y="16.8" text-anchor="middle">F</text>
        </svg>
      </button>
    </span>
    <!-- The notes' pair, the green one last so it keeps the right-hand end whether or
         not the selection bar is up. N copies the noted records as text and leaves
         everything as it was. The green one has two jobs: while there is nothing to
         save it shows the note boxes and hides them again; the moment a note is
         edited it becomes the way to download the whole file with the notes written
         into it, and goes back to being a toggle once that is done. -->
    <span class="notebar">
    <button class="copybtn notecopy" id="noteCopy" hidden
            title="Copy the noted records as text">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="8.5" y="2.5" width="12.5" height="15.5" rx="2.5"/>
        <rect class="sheet" x="3" y="6" width="12.5" height="15.5" rx="2.5"/>
        <text x="9.25" y="16.8" text-anchor="middle">N</text>
      </svg>
    </button>
    <button id="noteBtn" aria-pressed="false" title="Add a note to each record">
      <svg class="ico-note" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14.5 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h6"/>
        <path d="M8.5 7.5h6M8.5 11h6M8.5 14.5h3"/>
        <path d="M19.4 12.6l2 2-5 5-2.6.6.6-2.6z"/>
      </svg>
      <svg class="ico-save" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3.5v11"/><path d="M7.5 10L12 14.5 16.5 10"/><path d="M4.5 19.5h15"/>
      </svg>
    </button>
    </span>
  </header>

  <aside class="side" id="side">
    <h2>Sort</h2>
    <div class="sortbox" id="sortbox"></div>

    <h2>Filters <span class="muted" id="filterHint"></span></h2>
    <div class="actions">
      <button class="mini" id="resetFilters">Reset filters</button>
      <button class="mini" id="collapseAll">Collapse all</button>
      <!-- the help sits on the wrapper: a disabled button never shows its own tooltip,
           and this one is disabled exactly when nothing is filtered yet -->
      <button class="mini icobtn" id="copyFilters"
              title="Copy a description of the current filters, in words">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="8.5" y="2.5" width="12.5" height="15.5" rx="2.5"/>
          <rect class="sheet" x="3" y="6" width="12.5" height="15.5" rx="2.5"/>
        </svg>
      </button>
      <span class="ortip" title="OR — show records matching ANY of several filter sets.

Set up filters, then press OR: they are saved as a set and the panels clear, ready for the next one. A record is shown if it matches any saved set, or the panels you are filling in now.

Each saved set shows how many records it matches, and after × how many would disappear if you removed it with ✕.">
        <button class="mini" id="orFilter">OR</button>
      </span>
    </div>
    <div id="clauses"></div>
    <div id="filters"></div>

    <div class="spacer"></div>
    <h2>Display</h2>
    <div class="opts">
      <label>Records per page
        <select id="pageSize"><option>100</option><option>500</option><option>1000</option><option value="all">all</option></select>
      </label>
      <label>Card title field
        <select id="titleField"></select>
      </label>
      <label>Card subtitle field
        <select id="subField"></select>
      </label>
      <label>Card image field
        <select id="imageField"></select>
      </label>
      <label>View
        <select id="viewMode"><option value="cards">cards</option><option value="full">full-width records</option></select>
      </label>
      <label>Auto-link IDs
        <select id="autoLink"><option value="1">on</option><option value="0">off</option></select>
      </label>
    </div>
  </aside>

  <main class="main">
    <details class="meta" id="metaBox">
      <summary>Metadata &amp; dataset info <span class="mhint">— data source, record array, shown fields</span></summary>
      <div class="metabody">
        <!-- static controls: never re-rendered, so their listeners survive renderMeta() -->
        <div class="kv"><span class="k">load JSON</span><span class="v metaload">
          <input type="url" id="urlInput" placeholder="https://…/data.json" autocomplete="off">
          <button id="urlLoadBtn">Load from URL</button>
          <button id="loadBtn">Load file…</button>
          <input type="file" id="fileInput" accept=".json,application/json" hidden>
        </span></div>
        <div class="kv"><span class="k">main record array</span><span class="v"><select id="recordArray"></select></span></div>
        <div id="metaBody"></div>
      </div>
    </details>
    <div id="cards" class="grid"></div>
    <div id="emptyState" class="empty" style="display:none">
      <div>No JSON loaded.</div>
      <div id="emptyErr" class="loaderr" style="display:none"></div>
      <div class="loaders">
        <input type="url" id="emptyUrlInput" placeholder="https://…/data.json" autocomplete="off">
        <button class="primary" id="emptyUrlLoad">Load JSON from URL</button>
        <button class="primary" id="emptyLoad">Load JSON file</button>
      </div>
      <div class="muted" style="margin-top:8px">…or drag &amp; drop a .json file anywhere.</div>
    </div>
  </main>
</div>
<div id="drop">Drop JSON file to load</div>
<!-- the clipboard's own confirmation is a colour flash; this says the same thing in
     words, for a screen reader and for anyone who cannot tell the two colours apart.
     Outside the selection bar, which is hidden between copies. -->
<span id="copyStatus" class="sr" role="status" aria-live="polite"></span>
<!-- Leaving the page can only ever raise the browser's own generic prompt, so the
     three-way choice lives here, on the in-page actions that would really discard
     notes: loading another file, dropping one, changing the record array. -->
<div id="guard" class="guard" hidden>
  <div class="gbox" role="dialog" aria-modal="true" aria-labelledby="guardMsg">
    <div class="gmsg" id="guardMsg"></div>
    <div class="gacts">
      <button class="primary" id="guardSave">Download the JSON first</button>
      <button id="guardDiscard">Discard the notes</button>
      <button id="guardCancel">Cancel</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NULLKEY = "(null)";
const isMissing = v => v===null || v===undefined || v==="";
/* a records array may hold anything at all, and `in` throws on a primitive */
const isRec = r => !!r && typeof r==="object";
const bare = () => Object.create(null);      // a lookup table safe to key by field name
/* Reading a field by name, own properties only. `k in r` and a bare `r[k]` both
   walk the prototype chain, so a field called __proto__ — or constructor, or
   toString — would report Object.prototype as the value of every record that does
   NOT have that key: a phantom facet value, and a phantom row on the card. JSON
   defines fields as own properties, so nothing legitimate is lost by insisting. */
const own = Object.prototype.hasOwnProperty;
const has = (r,k) => isRec(r) && own.call(r,k);
const val = (r,k) => has(r,k) ? r[k] : undefined;
const valKey = v => (v===null||v===undefined) ? NULLKEY : String(v);

const state = {
  raw:null, recordKey:null, records:[], meta:{}, fileName:"",
  fields:[], scalarFields:[], complexFields:[],
  values:{}, missCount:{}, presCount:{},
  facetVal:{}, facetMiss:{}, facetPres:{},   // live, recomputed each apply()
  filters:{},            // field -> {vals:Set, missing:bool, present:bool}   (the live set)
  clauses:[],            // saved filter sets, OR-ed with each other and with the live one
  search:"", searchMode:"plain", pageSize:100, page:0,   // searchMode: "plain" | "terms" | "whole" — the ▼ menu
  sorts:[],              // [{k,desc,last}] — level 1 first, each breaking the one above
  titleSel:null, subSel:null, viewMode:"cards",
  hidden:new Set(),      // fields switched off in the metadata panel (display only)
  autoLink:true, linkPlan:{}, linkFields:{},   // identifier auto-linking (presentational only)
  imageFields:[], imageAuto:null, imageSel:null,   // columns holding images; the safe default; the pick
  fieldLen:{},                                     // how long each column's values print
  /* Records ticked for copying, held by reference rather than by index: filtering,
     sorting and paging then cost the selection nothing. Deliberately not in the URL. */
  selected:new Set(),
  shortOff:new Set(),    // fields left out of the short copy (URL: h2), as hidden is of the page
  /* Notes the reader writes on the records. Held by reference like the selection,
     and like it kept out of the URL — a note is the reader's own, and a link is not
     the place to carry it. They live only until the page is closed, so notesDirty
     drives both the button's icon and the warning on the way out. */
  notes:new Map(), notesOn:false, notesDirty:false,
  /* set when the file arrived with a notes column of its own: the boxes then edit
     THAT field rather than adding a second one beside it */
  notesAdopted:false,
  base:[],               // what matches, in file order; filtered is this, ordered
  filtered:[], pageItems:[], restoring:false,
  /* apply() skips the work whose inputs have not changed; these say what it did.
     Three integers, so the invariant "turning a page re-sorts nothing" is something
     a test can assert rather than infer from a stopwatch. */
  dataRev:0, sigRows:null, sigSort:null, stats:{filters:0,sorts:0,facets:0}
};

/* ---------- identifier auto-linking ----------
   Turn well-known identifiers (DOI, ORCID, OpenAlex, ROR, …) into links to their
   canonical resolver. Purely presentational: filtering, faceting, search and the
   URL state all keep working on raw values, and nothing is fetched at render time.

   Each entry: {id, label, tier, fields, re, url}
     tier "self" — the value alone is unambiguous; links in any field, any depth.
     tier "name" — value pattern is ambiguous, so the field name must match `fields`.
     tier "plan" — distinctive pattern with no name hint; links only where the field
                   name matches OR buildLinkPlan() saw ~the whole column match it.
   `re` must be anchored. `url(m, value)` returns the target, or null to decline
   (used for checks a regex can't express, e.g. ISBN length).
   Order is most-specific-first; the first resolver that matches wins.
   To add a scheme, add one row — nothing else in the file needs to change.       */
const encPath = s => String(s).split("/").map(encodeURIComponent).join("/");
const digits  = s => String(s).replace(/[\s-]/g,"").toUpperCase();

const LINKERS = [
  /* --- self-identifying --- */
  {id:"doi", label:"DOI", tier:"self", fields:/doi/,
   re:/^(?:doi:)?(10\.\d{4,9}\/[^\s"]+)$/i,       // legacy DOIs may contain < > ; ( )
   url:m=>"https://doi.org/"+encPath(m[1])},
  {id:"orcid", label:"ORCID", tier:"self", fields:/orcid/,
   re:/^(?:orcid:)?((?:\d{4}-){3}\d{3}[\dX])$/i,
   url:m=>"https://orcid.org/"+m[1].toUpperCase()},
  {id:"arxiv", label:"arXiv", tier:"self", fields:/arxiv/,
   re:/^arxiv:\s*(\d{4}\.\d{4,5}(?:v\d+)?|[a-z-]+(?:\.[A-Za-z]{2})?\/\d{7}(?:v\d+)?)$/i,
   url:m=>"https://arxiv.org/abs/"+encPath(m[1])},
  {id:"pmcid", label:"PMCID", tier:"self", fields:/pmc/,
   re:/^(PMC\d{5,9})$/i,
   url:m=>"https://www.ncbi.nlm.nih.gov/pmc/articles/"+m[1].toUpperCase()+"/"},
  {id:"repec", label:"RePEc/EDIRC", tier:"self", fields:/repec/,
   re:/^RePEc:edi:([a-z0-9]+)$/i,                       // other RePEc namespaces resolve differently
   url:m=>"https://edirc.repec.org/data/"+m[1].toLowerCase()+".html"},
  {id:"hdl", label:"Handle", tier:"self", fields:/(^|_)(hdl|handle)(_|$)/,
   re:/^hdl:(\S+)$/i,
   url:m=>"https://hdl.handle.net/"+encPath(m[1])},

  /* --- field-name gated --- */
  {id:"pmid", label:"PubMed", tier:"name", fields:/(^|_)pmid(_|$)|pubmed/,
   re:/^(\d{4,9})$/,
   url:m=>"https://pubmed.ncbi.nlm.nih.gov/"+m[1]+"/"},
  {id:"issn", label:"ISSN", tier:"name", fields:/issn/,
   re:/^(\d{4})-?(\d{3}[\dX])$/i,
   url:m=>"https://portal.issn.org/resource/ISSN/"+m[1]+"-"+m[2].toUpperCase()},
  {id:"isbn", label:"ISBN", tier:"name", fields:/isbn/,
   re:/^([\dX][\dX-]{8,21})$/i,
   url:m=>{ const d=digits(m[1]); return /^\d{9}[\dX]$|^\d{13}$/.test(d) ? "https://openlibrary.org/isbn/"+d : null; }},
  {id:"wikidata", label:"Wikidata", tier:"name", fields:/wikidata|(^|_)qid(_|$)/,
   re:/^(Q\d+)$/,
   url:m=>"https://www.wikidata.org/wiki/"+m[1]},
  {id:"arxiv_bare", label:"arXiv", tier:"name", fields:/arxiv/,
   re:/^(\d{4}\.\d{4,5}(?:v\d+)?|[a-z-]+(?:\.[A-Za-z]{2})?\/\d{7}(?:v\d+)?)$/i,
   url:m=>"https://arxiv.org/abs/"+encPath(m[1])},
  {id:"ssrn", label:"SSRN", tier:"name", fields:/ssrn/,
   re:/^(\d{4,9})$/,
   url:m=>"https://papers.ssrn.com/sol3/papers.cfm?abstract_id="+m[1]},
  {id:"s2paper", label:"Semantic Scholar", tier:"name", fields:/(^|_)s2(_|$)|semantic_?scholar/,
   re:/^([0-9a-f]{40})$/i,
   url:m=>"https://www.semanticscholar.org/paper/"+m[1].toLowerCase()},
  {id:"s2corpus", label:"S2 CorpusID", tier:"name", fields:/corpus_?id|(^|_)s2(_|$)/,
   re:/^(\d{4,12})$/,
   url:m=>"https://api.semanticscholar.org/CorpusID:"+m[1]},
  {id:"github", label:"GitHub", tier:"name", fields:/github|(^|_)repo(_|$)/,
   re:/^([\w.-]+)\/([\w.-]+)$/,
   url:m=>/^\.|\.\./.test(m[1]+m[2]) ? null : "https://github.com/"+m[1]+"/"+m[2]},
  {id:"email", label:"Email", tier:"name", fields:/e?mail|contact/,
   re:/^([^@\s]+@[^@\s]+\.[A-Za-z]{2,})$/,
   url:m=>"mailto:"+encodeURI(m[1])},
  {id:"host", label:"Web", tier:"name", fields:/(^|_)(url|uri|link|links|homepage|website|site|page|www)(_|$)/,
   re:/^((?:www\.)?[a-z0-9][a-z0-9.-]*\.[a-z]{2,}(?:[\/?#]\S*)?)$/i,
   url:m=>"https://"+m[1]},
  {id:"viaf", label:"VIAF", tier:"name", fields:/viaf/,
   re:/^(\d{5,22})$/,
   url:m=>"https://viaf.org/viaf/"+m[1]},
  {id:"isni", label:"ISNI", tier:"name", fields:/isni/,
   re:/^([\dX][\dX\s-]{14,22})$/i,
   url:m=>{ const d=digits(m[1]); return /^\d{15}[\dX]$/.test(d) ? "https://isni.org/isni/"+d : null; }},
  {id:"handle", label:"Handle", tier:"name", fields:/(^|_)(hdl|handle)(_|$)/,
   re:/^(\d{2,5}(?:\.\d+)*\/\S+)$/,
   url:m=>"https://hdl.handle.net/"+encPath(m[1])},

  /* --- distinctive but ambiguous: need a name gate or a whole-column match --- */
  {id:"openalex", label:"OpenAlex", tier:"plan", fields:/openalex/,
   re:/^([WASICPFT]\d{7,10})$/,
   url:m=>"https://openalex.org/"+m[1].toUpperCase()},
  {id:"ror", label:"ROR", tier:"plan", fields:/(^|_)ror(_|$)/,
   re:/^(0[0-9a-hj-km-np-tv-z]{6}\d{2})$/i,            // Crockford base32 + 2 check digits
   url:m=>"https://ror.org/"+m[1].toLowerCase()}
];
const LINKER_BY_ID = {}; for(const L of LINKERS) LINKER_BY_ID[L.id]=L;

const normKey = k => String(k).toLowerCase().replace(/[^a-z0-9]+/g,"_");
function tryLinker(L,s){
  const m=L.re.exec(s); if(!m) return null;
  const u=L.url(m,s);   if(!u) return null;             // resolver declined (failed its own check)
  return {id:L.id, label:L.label, url:u};
}
/* Which resolver, if any, claims this value in this field? Cheap: anchored regexes,
   at most a handful of candidates per cell, nothing compiled at call time. */
const GATED=new Map();                       // field name -> the linkers whose gate it passes
function gatedFor(nk){
  let l=GATED.get(nk);
  if(!l){ l=LINKERS.filter(L=>L.fields&&L.fields.test(nk)); GATED.set(nk,l); }
  return l;
}
function resolveLink(value, key){
  const s=String(value).trim();
  if(!s || s.length>300) return null;                   // no pathological inputs
  for(const L of LINKERS){ if(L.tier!=="self") continue; const h=tryLinker(L,s); if(h) return h; }
  if(key!=null){
    const nk=normKey(key);
    for(const L of gatedFor(nk)){ const h=tryLinker(L,s); if(h) return h; }
    const planned=state.linkPlan[key];                  // promoted for this whole column
    if(planned) return tryLinker(LINKER_BY_ID[planned], s);
  }
  return null;
}
const autoLinkFor = (v,key) => state.autoLink ? resolveLink(v,key) : null;

/* Promote an ambiguous resolver for a scalar field when it covers ~the whole column,
   and record the dominant scheme per field for the metadata panel. Runs in analyze(),
   so rendering only ever tests the field's own candidates. */
function buildLinkPlan(){
  state.linkPlan=bare(); state.linkFields=bare();
  const CAP=200, ambiguous=LINKERS.filter(L=>L.tier==="plan");
  for(const k of state.scalarFields){
    const vals=[];
    for(const v of state.values[k].keys()){ vals.push(v); if(vals.length>=CAP) break; }
    if(!vals.length) continue;
    const need=Math.ceil(vals.length*0.9);
    for(const L of ambiguous){
      let n=0; for(const v of vals) if(tryLinker(L,v)) n++;
      if(n>=need){ state.linkPlan[k]=L.id; break; }
    }
    const tally={};
    for(const v of vals){ const h=resolveLink(v,k); if(h) tally[h.id]=(tally[h.id]||0)+1; }
    let best=null; for(const id in tally) if(!best||tally[id]>tally[best]) best=id;
    if(best) state.linkFields[k]=LINKER_BY_ID[best].label;
  }
}
/* ---------- image fields ----------
   A scalar field whose values are image URLs is shown as a thumbnail on the card
   instead of as a text row. Detected per field, not per value, so every card gets
   the same treatment: either the whole column is pictures or none of it is.      */
const IMG_EXT=/\.(?:jpe?g|png|gif|webp|avif|svg|bmp|ico|tiff?)(?:[?#]|$)/i;
const IMG_NAME=/(^|_)(image|images|img|photo|photos|picture|pic|thumb|thumbnail|avatar|logo|icon|cover|portrait|headshot|banner|poster)(_|$)/;
const isURL = s => /^(?:https?:)?\/\//i.test(String(s).trim());
function isImageURL(s){
  const v=String(s).trim();
  if(/^data:image\//i.test(v)) return true;
  return isURL(v) && IMG_EXT.test(v);
}
/* Is THIS value a picture, in a field of this name? Columns named like a picture
   (avatar, logo, …) count plain URLs; elsewhere the extension has to say so. */
function isImageValue(v,key){
  const s=String(v).trim();
  return isImageURL(s) || (key!=null && IMG_NAME.test(normKey(key)) && isURL(s));
}
/* Two bars, because choosing and guessing want different strictness:
     offered  — the column holds at least one image, so it is worth offering in the
                Card image field select. One picture in one record is enough.
     auto     — ~all of the column is images, so it is safe to pick on its own. A
                stray image URL in a column of notes must not hijack the cards.
   A field named like a picture (photo, avatar, logo, …) also counts plain URLs,
   since plenty of image services serve them without a file extension. */
function detectImageFields(){
  state.imageFields=[]; state.imageAuto=null;
  const CAP=200;                       // the ratio is judged on a sample; "any" is not
  for(const k of state.scalarFields){
    let seen=0, hits=0, any=false;
    for(const v of state.values[k].keys()){
      const hit=isImageValue(v,k);
      if(hit) any=true;
      if(seen<CAP){ seen++; if(hit) hits++; }
      else if(any) break;              // past the sample, only the first picture matters
    }
    if(!any) continue;
    state.imageFields.push(k);
    if(!state.imageAuto && hits>=Math.ceil(seen*0.9)) state.imageAuto=k;
  }
}
/* null when the user chose "(none)", or when nothing was safe to pick on its own */
function imageField(){
  if(state.imageSel!==null)
    return (state.imageSel===""||!state.imageFields.includes(state.imageSel)) ? null : state.imageSel;
  return state.imageAuto;
}
function imageHTML(src,alt){
  const u=esc(String(src));
  return '<a class="cardimg" href="'+u+'" target="_blank" rel="noopener noreferrer">'+
         '<img src="'+u+'" alt="'+esc(alt)+'" loading="lazy" decoding="async" referrerpolicy="no-referrer" '+
         'onerror="this.parentNode.style.display=\'none\'"></a>';   // a dead URL leaves no gap
}

function linkHTML(href,text,note,cls){
  return '<a'+(cls?' class="'+cls+'"':'')+' href="'+esc(href)+'" target="_blank" rel="noopener noreferrer"'+
         (note?' title="'+esc(note)+'"':'')+'>'+esc(text)+'</a>';
}
const linkNote = h => h.label+" → "+h.url;
/* A URL that was literally in the data and is too long to read is replaced by a
   label saying what following it does, with the full address in the tooltip.
   Identifier links are never shortened — their text is the identifier, the point
   of the field. The file extension is the only honest clue available offline
   about whether a link downloads something or opens a page. */
const URL_TEXT_MAX = 20;
const PDF_EXT=/\.pdf(?:[?#]|$)/i;
const FILE_EXT=/\.(?:zip|gz|tgz|bz2|xz|7z|rar|tar|docx?|xlsx?|pptx?|odt|ods|odp|rtf|epub|csv|tsv|txt|json|xml|ya?ml|parquet|dta|sav|sas7bdat|rds|rdata|mat|nc|h5|jpe?g|png|gif|webp|avif|svg|bmp|tiff?|mp3|mp4|mov|avi|mkv|wav|flac|exe|dmg|pkg|deb|rpm|msi|iso)(?:[?#]|$)/i;
function linkLabel(url,key){
  if(isImageURL(url)) return "show image";       // opens in a new tab, like the thumbnail
  if(PDF_EXT.test(url)) return "download pdf";
  if(FILE_EXT.test(url)) return "download";
  return key==null||key==="" ? "open link" : "open "+key;
}

/* ---------- record-array discovery ---------- */
function arrayCandidates(raw){
  const out=[];
  if(Array.isArray(raw)) out.push({key:"__root__", label:"(root array)", n:raw.length});
  else if(raw && typeof raw==="object")
    for(const k in raw) if(Array.isArray(raw[k])) out.push({key:k, label:k, n:raw[k].length});
  return out;
}
function recordsFor(raw,key){
  let v = key==="__root__" ? raw : (raw && typeof raw==="object" ? raw[key] : undefined);
  if(Array.isArray(v)) return v;              // normal case: an array of records
  if(v && typeof v==="object") return [v];    // lone object -> treat as a single record
  return [];                                   // scalar / nothing -> no records
}
function metaFor(raw,key){
  if(key==="__root__" || !raw || typeof raw!=="object") return bare();
  const o=bare(); for(const x in raw) if(x!==key) o[x]=raw[x]; return o;
}

/* ---------- analysis ---------- */
function analyze(){
  const fieldSet=[], seen=new Set(), nonScalar=new Set();
  for(const r of state.records){
    if(!r||typeof r!=="object") continue;
    for(const k in r){
      if(!seen.has(k)){ seen.add(k); fieldSet.push(k); }
      const v=r[k]; if(v!==null && v!==undefined && typeof v==="object") nonScalar.add(k);
    }
  }
  state.fields=fieldSet;
  state.scalarFields=fieldSet.filter(k=>!nonScalar.has(k));
  state.complexFields=fieldSet.filter(k=>nonScalar.has(k));
  /* Object.create(null): a field named __proto__ would otherwise not be a normal
     key — assigning a number to it is a silent no-op, and its count would print
     as "[object Object]" */
  state.values=bare(); state.filters=bare(); state.missCount=bare(); state.presCount=bare();
  for(const k of state.scalarFields){ state.values[k]=new Map(); state.filters[k]={vals:new Set(),missing:false,present:false}; state.missCount[k]=0; state.presCount[k]=0; }
  const total=state.records.length;
  for(const r of state.records){
    for(const k of state.scalarFields){
      const v = val(r,k);
      if(isMissing(v)){ state.missCount[k]++; }
      else { state.presCount[k]++; const m=state.values[k]; const kk=valKey(v); m.set(kk,(m.get(kk)||0)+1); }
    }
  }
  buildLinkPlan();          // reuse the distinct-value maps to decide per-field linking
  detectImageFields();
  measureFields();
}

/* ---------- load ---------- */
function loadData(raw, name){
  state.raw=raw; state.fileName=name||"";
  const cands=arrayCandidates(raw);
  const sel=$("#recordArray");
  sel.innerHTML = cands.map(c=>'<option value="'+esc(c.key)+'">'+esc(c.label)+' ('+c.n+')</option>').join("")
                  || '<option value="__root__">'+(raw&&typeof raw==="object"?"(whole object — 1 record)":"(no records)")+'</option>';
  // default pick: prefer named like findRecords
  let def = cands[0] ? cands[0].key : "__root__";
  const prefer=["authors","records","data","items","rows","results"];
  for(const p of prefer){ if(cands.some(c=>c.key===p)){ def=p; break; } }
  state.recordKey=def; sel.value=def;
  setRecordSource(def, true);
  $("#fileName").textContent = name ? (name+" — "+state.records.length+" records") : "";
  $("#emptyState").style.display = state.records.length ? "none":"block";
}
function setRecordSource(key, keepSearch){
  state.recordKey=key;
  state.dataRev++;              // different records entirely: nothing apply() cached still holds
  state.records=recordsFor(state.raw,key)||[];
  state.meta=metaFor(state.raw,key);
  analyze();
  state.titleSel=null; state.subSel=null; state.imageSel=null;
  state.sorts=[]; state.sortSig=null;
  state.hidden.clear(); state.clauses=[];                         // field names differ per array
  state.selected.clear();                        // the basket held records of the old array
  state.shortOff.clear();
  /* the notes belonged to records that are gone; whoever got us here has already
     offered to save them. What the new array carries of its own is read in instead. */
  state.notes.clear(); state.notesDirty=false; seedNotes(); renderNoteBtn();
  state.page=0; if(!keepSearch){ state.search=""; $("#globalSearch").value=""; }
  populateFieldSelects();
  renderMeta(); renderFilters(); renderClauses(); apply();
}

/* ---------- metadata ---------- */
function renderMeta(){
  const rows=[];
  rows.push(metaRow("records", state.records.length));
  rows.push(metaRow("fields", state.fields.length+"  ("+state.scalarFields.length+" filterable / one-to-one)"+
    '<span id="hidNote" class="muted">'+hiddenNote()+'</span>', true));
  rows.push(toggleRow("one-to-one fields", state.scalarFields, "scalar"));
  if(state.complexFields.length) rows.push(toggleRow("nested fields", state.complexFields, "complex"));
  rows.push(shortRow());
  const lf=Object.keys(state.linkFields);
  if(lf.length) rows.push(metaRow("linked ID fields",
    lf.map(k=>k+" ("+state.linkFields[k]+")").join(", ")+(state.autoLink?"":"   — auto-linking off")));
  if(state.imageFields.length) rows.push(metaRow("image fields",
    '<span id="imgNote">'+imageNote()+'</span>', true));
  for(const k in state.meta){
    const v=state.meta[k];
    /* A file that parks its metadata in an object — "metadata": {...} — would
       otherwise spend a whole indentation layer on the wrapper. List its entries
       at this level instead; anything deeper still nests. */
    if(v && typeof v==="object" && !Array.isArray(v) && Object.keys(v).length){
      for(const kk in v) rows.push(metaRow(kk, renderValue(v[kk],kk), true));
      continue;
    }
    rows.push(metaRow(k, renderValue(v,k), true));
  }
  $("#metaBody").innerHTML=rows.join("");
}
function metaRow(k,v,raw){ return '<div class="kv"><span class="k">'+esc(k)+'</span><span class="v">'+(raw?v:esc(String(v)))+'</span></div>'; }
const hiddenNote = () => state.hidden.size ? "   — "+state.hidden.size+" hidden" : "";
function imageNote(){                      // which column is the thumbnail, and what the rest do
  const sel=imageField();
  return state.imageFields.map(k=>esc(k)+(k!==sel ? "" :
      state.hidden.has(k) ? "  (card image — switched off)" : "  (card image)")).join(", ")
    + (sel ? "" : "   — no card image; pick one under Display");
}
/* One checkbox per field: unchecking hides it from the records, nothing else.
   The title/subtitle fields are shown in the card heading, so their boxes are
   fixed on — the Display selects, not this row, decide those. */
function toggleRow(label, fields, group){
  if(!fields.length) return "";
  const tf=titleField(), sub=subtitleField();
  const chips=fields.map(k=>{
    if(k===tf||k===sub) return '<label class="ftog fixed" title="in the card heading — set under Display">'+
      '<input type="checkbox" checked disabled>'+esc(k)+'</label>';
    const on=!state.hidden.has(k), susp=!on&&fieldActive(state.filters[k]);
    return '<label class="ftog'+(on?"":" off")+(susp?" susp":"")+'"'+
      (susp?' title="its filter is suspended while the field is off"':'')+
      '><input type="checkbox" data-fieldtog="'+esc(k)+'"'+(on?" checked":"")+'>'+esc(k)+'</label>';
  }).join("");
  return '<div class="kv"><span class="k">'+esc(label)+'</span><span class="v">'+
    '<span class="togacts"><button class="mini" data-tog="all" data-group="'+group+'">all</button>'+
    '<button class="mini" data-tog="none" data-group="'+group+'">none</button></span>'+
    chips+'</span></div>';
}
/* The S button's glyph again, small and in the accent colour, so the row below it
   is recognizable as belonging to that button rather than to the display. */
const SHORT_ICO='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+
  '<rect x="8.5" y="2.5" width="12.5" height="15.5" rx="2.5"/>'+
  '<rect class="sheet" x="3" y="6" width="12.5" height="15.5" rx="2.5"/>'+
  '<text x="9.25" y="16.8" text-anchor="middle">S</text></svg>';
/* the same sheets without the letter — the copy glyph plain, as the filter
   description's button wears it */
const COPY_ICO='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+
  '<rect x="8.5" y="2.5" width="12.5" height="15.5" rx="2.5"/>'+
  '<rect class="sheet" x="3" y="6" width="12.5" height="15.5" rx="2.5"/></svg>';
const shortNote = () => state.shortOff.size ? "   — "+state.shortOff.size+" left out" : "";
/* Which fields the SHORT copy prints. The same shape as the display toggles above,
   but unticking one here changes nothing on screen and nothing in the full copy:
   only what the S button writes. The title and subtitle ARE offered, unlike above —
   they cannot leave the card, but a short copy may well want neither. A field
   switched off above is in no copy at all, so it is shown greyed out here. */
function shortRow(){
  /* the notes are offered here too, once any exist: they are copied by default, and
     this is the one place to say otherwise. An adopted column is already in the list
     under its own name, and that one chip governs the notes written in its place. */
  const fields=state.scalarFields.concat(state.complexFields)
    .concat(state.notes.size&&!state.notesAdopted?[NOTE_LABEL()]:[]);
  if(!fields.length) return "";
  const chips=fields.map(k=>{
    const on=!state.shortOff.has(k);
    return '<label class="ftog'+(on?"":" off")+(state.hidden.has(k)?" gone":"")+'"'+
      (state.hidden.has(k)?' title="the field is switched off, so no copy shows it"':"")+
      '><input type="checkbox" data-shorttog="'+esc(k)+'"'+(on?" checked":"")+'>'+esc(k)+'</label>';
  }).join("");
  return '<div class="kv shortrow"><span class="k">'+SHORT_ICO+'short copy fields'+
    '<span id="shortNote" class="muted">'+shortNote()+'</span></span><span class="v">'+
    '<span class="togacts"><button class="mini" data-stog="all">all</button>'+
    '<button class="mini" data-stog="none">none</button>'+
    '<button class="mini icobtn" data-stog="mirror" aria-label="mirror the page\'s fields"'+
    ' title="Mirror the page: tick exactly the fields the cards show, so the short '+
    'copy carries what they carry">'+COPY_ICO+'</button></span>'+
    chips+'</span></div>';
}

/* ---------- filters ---------- */
function renderFilters(){
  $("#filters").innerHTML = state.scalarFields.map(k=>
    '<details class="ffield" data-field="'+esc(k)+'">'+
      '<summary><span>'+esc(k)+'</span><span class="n">'+state.values[k].size+'</span></summary>'+
      '<div class="fbody" data-rendered="0"></div>'+
    '</details>').join("");
  syncFieldUI();
}
/* Everything in the sidebar that depends on which fields are switched on. A field
   switched off in the metadata panel loses its filter panel and drops out of the
   sort list. The panel is only display:none — its open state, rendered body and
   selected values survive, so switching the field back on restores it as it was. */
function syncFieldUI(){
  let shown=0;
  document.querySelectorAll(".ffield").forEach(det=>{
    const off=state.hidden.has(det.dataset.field);
    det.style.display=off?"none":"";
    if(!off) shown++;
  });
  const tot=state.scalarFields.length;
  $("#filterHint").textContent="("+(shown<tot?shown+" of "+tot:tot)+" fields)";
  state.sortSig=null;            // the field list changed, so rebuild the sort selects
  renderSortSelects(activeSorts());
}

/* ---------- the sort selects ----------
   At most three levels: past that the ordering is doing more than a reader can
   follow, and every extra select costs sidebar room.
   One per level, plus one more while the order is still undecided, so the cascade
   grows only as far as the data needs. Each field appears twice (▴ ascending, ▾
   descending); the direction rides on a data attribute rather than inside the
   value, so a field name keeps its own characters whatever they are. */
function sortOptions(sel,level){
  const none=level ? "(none)" : "(file order)";
  /* data-k marks a real field: a field named "" would otherwise produce an option
     indistinguishable from this one, and picking it would silently mean "no sort" */
  return '<option value="">'+none+'</option>'+
    state.scalarFields.filter(k=>!state.hidden.has(k)).map(k=>{
      const o='<option data-k value="'+esc(k)+'"';
      /* usesLastWord, not sel.last: a stale last=1 on a field that has no last-word
         options degrades to the plain ascending one rather than matching nothing */
      const on=(desc,last)=> sel&&sel.k===k&&!!sel.desc===desc&&usesLastWord(sel)===last ? " selected" : "";
      return o+on(false,false)+'>'+esc(k)+' ▴</option>'+
             o+' data-desc="1"'+on(true,false)+'>'+esc(k)+' ▾</option>'+
        (isNameField(k) ?                            // surname ordering, for a list of people
             o+' data-last="1"'+on(false,true)+'>'+esc(k)+' (last word) ▴</option>'+
             o+' data-last="1" data-desc="1"'+on(true,true)+'>'+esc(k)+' (last word) ▾</option>' : "");
    }).join("");
}
function renderSortSelects(levels){
  levels=levels||activeSorts();
  const extra=sortHasTies(levels)?1:0;             // ties left -> offer to break them
  const n=Math.min(MAX_SORTS,Math.max(1,state.sorts.length+extra));
  const sig=n+"|"+state.sorts.map(s=>s.k+(s.desc?"▾":"▴")+(s.last?"L":"")).join(",")+
            "|"+state.scalarFields.filter(k=>!state.hidden.has(k)).join(",");
  if(state.sortSig===sig) return;                  // nothing structural changed; leave the DOM alone
  state.sortSig=sig;
  let html="";
  for(let i=0;i<n;i++){          // each level is stepped in a little, no wording needed
    const sel=state.sorts[i]||null;
    html += '<div class="slev slev'+i+'"><select data-level="'+i+'"'+(i?'':' id="sortField"')+'>'+
            sortOptions(sel,i)+'</select></div>';
  }
  $("#sortbox").innerHTML=html;
}
function renderFieldBody(det){
  const k=det.dataset.field, body=det.querySelector(".fbody");
  if(body.dataset.rendered==="1") return; body.dataset.rendered="1";
  const f=state.filters[k];
  const many=state.values[k].size>12;          // stable decision (full distribution)
  body.innerHTML=
    '<div class="miss-row">'+
      '<label><input type="checkbox" data-field="'+esc(k)+'" data-kind="present"'+(f.present?" checked":"")+'> not missing <span class="vc" data-c="present">'+fcount("facetPres",k)+'</span></label>'+
      '<label><input type="checkbox" data-field="'+esc(k)+'" data-kind="missing"'+(f.missing?" checked":"")+'> missing <span class="vc" data-c="missing">'+fcount("facetMiss",k)+'</span></label>'+
    '</div>'+
    '<div class="row1">'+
      (many?'<input class="fsearch" placeholder="filter values…">':'')+
      '<button class="mini act-all">all</button><button class="mini act-none">none</button>'+
    '</div><div class="vals"></div>';
  paintVals(det);
  const fs=body.querySelector(".fsearch");
  if(fs) fs.addEventListener("input",()=>paintVals(det,fs.value));
  body.querySelector(".act-all").addEventListener("click",()=>toggleAllValues(k,true,det));
  body.querySelector(".act-none").addEventListener("click",()=>toggleAllValues(k,false,det));
}
function updateMissRow(det){                    // refresh the present/missing counts live
  const k=det.dataset.field;
  const p=det.querySelector('.vc[data-c="present"]'); if(p) p.textContent=fcount("facetPres",k);
  const m=det.querySelector('.vc[data-c="missing"]'); if(m) m.textContent=fcount("facetMiss",k);
}
/* update every field's summary count and repaint any open filter body live */
function refreshFacetUI(){
  document.querySelectorAll(".ffield").forEach(det=>{
    const k=det.dataset.field;
    if(state.hidden.has(k)) return;              // no panel on screen, no facet computed
    const n=det.querySelector("summary .n"); if(n) n.textContent=fcount("facetVal",k).size;
    const body=det.querySelector(".fbody");
    if(det.open && body && body.dataset.rendered==="1"){
      updateMissRow(det);
      const fs=body.querySelector(".fsearch");
      paintVals(det, fs?fs.value:"");
    }
  });
}
/* Commonest value first — the counts shown next to them are what you are scanning
   for. Equal counts fall back to the value itself (numbers numerically, then text)
   so the order is predictable rather than incidental.

   A numeric column is the exception: it is a scale, not a set of labels. Years or
   scores read as 1990, 1991, 1992 …; ordering those by popularity scatters them and
   hides where the range starts and ends, so they sort by value instead. */
function sortVals(entries,k){
  if(isNumericField(k))
    return entries.sort((a,b)=>{
      const an=isNumVal(a[0]), bn=isNumVal(b[0]);
      if(an&&bn) return parseFloat(a[0])-parseFloat(b[0]);
      if(an!==bn) return an?-1:1;        // the odd non-numeric label sits after the scale
      return byValue(a[0],b[0]);
    });
  return entries.sort((a,b)=> b[1]-a[1] || byValue(a[0],b[0]));
}
const isNumericField = k => !!(state.fieldNum && state.fieldNum[k]);
function byValue(a,b){
  const na=parseFloat(a), nb=parseFloat(b);
  const an=!isNaN(na)&&/^-?\d/.test(a), bn=!isNaN(nb)&&/^-?\d/.test(b);
  if(an&&bn) return na-nb; if(an) return -1; if(bn) return 1;
  return a.toLowerCase()<b.toLowerCase()?-1:1;
}
/* The values a field's panel is offering, in the order it offers them: those still
   reachable under the OTHER filters, plus any already checked, narrowed by the
   type-ahead. The list, not the rows — paintVals caps what it draws, and "all" must
   not inherit that cap. */
function facetEntries(k,q){
  const fmap=fcount("facetVal",k), checked=state.filters[k].vals;
  let entries=[...fmap.entries()];
  for(const sel of checked){ if(!fmap.has(sel)) entries.push([sel,0]); }  // keep checked visible
  entries=sortVals(entries,k);
  if(q){ const ql=q.toLowerCase(); entries=entries.filter(e=>e[0].toLowerCase().includes(ql)); }
  return entries;
}
function paintVals(det,q){
  const k=det.dataset.field, vals=det.querySelector(".vals"), checked=state.filters[k].vals;
  const entries=facetEntries(k,q);
  const CAP=1000, shown=entries.slice(0,CAP);
  /* A checked value that no longer co-occurs (count 0) can land past the cap and
     vanish — and an invisible filter you cannot switch off is a trap. Pull any
     such value back into view. */
  if(entries.length>CAP) for(const e of entries.slice(CAP)) if(checked.has(e[0])) shown.push(e);
  vals.innerHTML=shown.map(([v,c])=>
    '<div class="vrow"><label><input type="checkbox" data-field="'+esc(k)+'" data-val="'+esc(v)+'"'+(checked.has(v)?" checked":"")+'>'+
    '<span class="vtxt">'+esc(v)+'</span></label><span class="vc">'+c+'</span></div>').join("")
    + (entries.length>shown.length?'<div class="muted" style="padding:4px">…'+(entries.length-shown.length)+' more — refine the filter</div>':'');
}
/* Everything the panel is offering, not merely the rows it drew: past the render cap
   "all" used to select the first 1000 and stop, with nothing to say it had. What the
   type-ahead has narrowed the panel to is still respected — that is what "all" means
   while a search is in the box. */
function toggleAllValues(k,on,det){
  const set=state.filters[k].vals;
  const fs=det.querySelector(".fsearch");
  for(const [v] of facetEntries(k,fs?fs.value:"")){ if(on) set.add(v); else set.delete(v); }
  det.querySelectorAll('.vals input[type=checkbox]').forEach(cb=>{ cb.checked=on; });
  markActive(det); apply();
}
function markActive(det){ const f=state.filters[det.dataset.field]; det.dataset.active=(f.vals.size||f.missing||f.present)?"1":"0"; }

/* ---------- saved clause summaries ---------- */
function describeTerm(k,f){
  const bits=[...f.vals].map(esc);
  if(f.present) bits.push("not missing");
  if(f.missing) bits.push("missing");
  return '<span class="ck">'+esc(k)+':</span> '+bits.join(" / ");   // values within a field are OR-ed
}
function renderClauses(){
  const box=$("#clauses");
  box.innerHTML = state.clauses.length
    ? '<div class="chead">saved filters — any of these</div>'+
      state.clauses.map((c,i)=>
        '<div class="clause"><button class="cx" data-clause="'+i+'" title="Remove this filter set">✕</button>'+
        '<span class="cbits">'+c.terms.map(([k,f])=>describeTerm(k,f)).join(' <span class="cand">and</span> ')+
        '</span><span class="cnums"><span class="ctot"></span><span class="cdel"></span></span></div>').join("")
    : "";
  const b=$("#orFilter");
  b.disabled=!liveClause();          // nothing to save yet
}
/* apply() tallies the counts; this writes them into the chips already on screen.
   Two numbers, because they answer different questions: how big is this set, and
   what would removing it cost. They differ exactly when sets overlap. */
function paintClauseCounts(){
  document.querySelectorAll("#clauses .clause").forEach((el,i)=>{
    const t=el.querySelector(".ctot"), d=el.querySelector(".cdel"); if(!t||!d) return;
    const u=(state.clauseUniq||[])[i]||0, h=(state.clauseHits||[])[i]||0;
    t.textContent=h.toLocaleString();
    t.title=h.toLocaleString()+" records match this set, whether or not another filter also shows them";
    d.textContent="×"+u.toLocaleString();
    d.title=u.toLocaleString()+" records would disappear if this set were removed"+

function clearLiveFilters(){
  for(const k in state.filters){ const f=state.filters[k]; f.vals.clear(); f.missing=false; f.present=false; }

    d.dataset.active="0";
    const b=d.querySelector(".fbody"); if(b){ b.dataset.rendered="0"; if(d.open) renderFieldBody(d); }
  });

/* ---------- filtering + paging ---------- */
function fieldActive(f){ return !!(f && (f.vals.size||f.missing||f.present)); }
function fieldOK(r,k,f){                      // does r satisfy field k's filter?
  const v=val(r,k), miss=isMissing(v);
  if(f.present&&!miss) return true;
  if(f.missing&&miss) return true;
  if(f.vals.size&&!miss&&f.vals.has(valKey(v))) return true;
  return false;
}
/* ---------- global search ----------
   Three modes, chosen from the ▼ menu beside the box.
   "plain" (the default): the whole query, quotes, spaces and all, matches as one
   literal substring of some field.
   "terms": the query is a list of OR-ed terms — bare words split on spaces, plus
   "double quoted" runs that match as one exact phrase, spaces included — the way
   to ask for words together in one field rather than anywhere in the record. A
   record is shown when ANY term occurs in ANY of its fields. An unclosed quote
   takes the rest of the query as its phrase; an empty "" contributes nothing.
   "whole": the same terms, but a term must BE a field rather than occur in one —
   `york` finds a record whose city is exactly York, not one merely mentioning it. */
function parseSearch(q){
  const terms=[], re=/"([^"]*)"?|(\S+)/g;
  for(let m; (m=re.exec(q)); ){ const t=(m[1]!==undefined?m[1]:m[2]).trim(); if(t) terms.push(t); }

}
const fieldText = v => ((typeof v==="object")?JSON.stringify(v):String(v)).toLowerCase();
/* Whole-field mode compares against complete values, so an array is its elements

   bracketed list it prints as is not. */
const fieldValues = v => Array.isArray(v) ? v.filter(e=>e!=null).map(fieldText) : [fieldText(v)];

function searchTerms(){
  if(searchCache.q!==state.search) searchCache={q:state.search, terms:parseSearch(state.search)};
  return searchCache.terms;
}
function searchOK(r){

  const mode=state.searchMode;

      if(fieldText(v).includes(state.search)) return true; }
    return false;

  const terms=searchTerms();
  if(!terms.length) return true;             // just quotes or spaces: nothing to require
  for(const k in r){ const v=r[k]; if(v==null) continue;
    if(mode==="whole"){ for(const s of fieldValues(v)) for(const t of terms) if(s===t) return true; }

}
/* ---------- saved filter sets (clauses) ----------

function makeClause(spec){
  const byField=bare();          // keyed by field name: a plain {} would take __proto__ as a prototype
  const term=k=>byField[k]||(byField[k]={vals:new Set(),missing:false,present:false});

  for(const k of spec.p||[]) term(k).present=true;

  const spec={f:bare(),p:[],m:[]};             // .f is keyed by field name — see makeClause
  let any=false;

    const f=state.filters[k]; if(!f||state.hidden.has(k)) continue;
    if(f.vals.size){ spec.f[k]=[...f.vals]; any=true; }

const clauseOK = (r,c) => c.terms.every(([k,f])=>fieldOK(r,k,f));

/* live terms are gathered once per apply(), not per record */
function liveTerms(){
  const out=[];

    if(state.hidden.has(k)) continue;          // switched off -> its filter is suspended
    const f=state.filters[k];
    if(fieldActive(f)) out.push([k,f]);
  }
  return out;
}

/* Honest facets: for each field, the values+counts available given the OTHER
   active filters (and search). A record contributes to field k's facet iff it
   fails AT MOST field k itself — so it fails 0 active filters (counts toward all
   fields) or exactly k (counts toward k only). O(records × active filters). */
function computeFacets(searched){

  const fv=bare(), fm=bare(), fp=bare();
  for(const k of SF){ fv[k]=new Map(); fm[k]=0; fp[k]=0; }
  const active=SF.filter(k=>fieldActive(state.filters[k]));
  for(const r of searched){
    let failed=null, cnt=0;
    for(const k of active){
      if(!fieldOK(r,k,state.filters[k])){ cnt++; if(cnt>1) break; failed=k; }
    }
    if(cnt>=2) continue;
    const targets = cnt===1 ? [failed] : SF;
    for(const k of targets){
      const v=val(r,k);

function fcount(map,k){ return (state[map]&&state[map][k])||(map==="facetVal"?new Map():0); }

/* ---------- long text fields ----------
   A paragraph squeezed into the value column of a card is a ribbon of six-word
   lines. Columns whose values run long are shown the way array fields are: a
   collapsible section across the full width of the card. Judged per column, so
   every card puts the same field in the same place, and measured on what a value
   actually PRINTS — a collapsed URL is a short label, a picture is no text. */
const LONG_TEXT=160;      // characters; beyond this a value reads as prose, not a field

function displayLen(v,key){

  const s=String(v);

  return s.length;

const NUM_VAL=/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/;
const isNumVal = v => NUM_VAL.test(String(v).trim());
function measureFields(){
  state.fieldLen=bare(); state.fieldNum=bare();
  const CAP=500;
  for(const k of state.scalarFields){
    const rows=[]; let n=0, seen=0, num=0;
    for(const [v,c] of state.values[k]){

      if(isNumVal(v)) num++;
      if(rows.length>=CAP) break;
    }
    /* Numeric when nearly every DISTINCT value is a number: the list being ordered

       labels is not numeric just because its 3 numeric values are the common ones.

    state.fieldNum[k]=rows.length>1 && num>=rows.length*0.9;
    if(!n){ state.fieldLen[k]=0; continue; }
    rows.sort((a,b)=>a[0]-b[0]);

       ones doesn't move a whole column into an expander */
    let len=0;
    for(const [l,c] of rows){ len=l; seen+=c; if(seen>=n*0.9) break; }
    state.fieldLen[k]=len;

const isLongText = k => (state.fieldLen[k]||0)>LONG_TEXT;
const textPeek = s => {

};

/* ---------- sorting ---------- */
/* A field actually called "name" gets two extra options that order by the LAST

   data calls the column something else. */
const NAME_FIELD=/^_*name_*$/;      // "name", "Name", " name " — but not full_name or surname
const isNameField = k => NAME_FIELD.test(normKey(k));

/* Suspended while its field is switched off, exactly like that field's filter. */

   skipped, exactly as a live filter on that field is suspended, and the ones below
   it move up rather than the whole sort collapsing. */
function activeSorts(){
  return state.sorts.filter(s=>s.k && state.scalarFields.includes(s.k) && !state.hidden.has(s.k));

  }

function sortHasTies(levels){

function cmpVals(a,b){

  const c=last ? (cmpVals(lastWord(a),lastWord(b)) || cmpVals(a,b)) : cmpVals(a,b);

/* ---------- what apply() may skip ----------

    const cs=state.clauses, n=cs.length;

  const pages=Math.max(1,Math.ceil(state.filtered.length/ps));
  if(state.page>=pages) state.page=pages-1; if(state.page<0) state.page=0;
  const start=state.page*ps, end=Math.min(start+ps,state.filtered.length);
  state.pageItems=state.filtered.slice(start,end);

    ?((start+1).toLocaleString()+"–"+end.toLocaleString()+" / "+state.filtered.length.toLocaleString()+"  (pg "+(state.page+1)+"/"+pages+")"):"0";

     be saying "1-3 / 3 (pg 1/1)" — chrome for a job that is not on offer. */
  $(".pager").style.display = (state.pageSize==="all"||pages<=1) ? "none" : "flex";
  renderCards();

/* ---------- URL sync (shareable filter state) ---------- */
/* Built by hand rather than with URLSearchParams, so that anything repeated packs
   into ONE comma-joined parameter: f.university=A,B,C instead of the field name
   over and over. Each value is percent-encoded first, so a comma inside a value
   arrives as %2C and can never be mistaken for the separator. */
const encQ = s => encodeURIComponent(String(s)).replace(/%20/g,"+");
const decQ = s => decodeURIComponent(String(s).replace(/\+/g," "));
function syncURL(){

  const list=(k,vs)=>{ if(vs.length) parts.push(encQ(k)+"="+vs.map(encQ).join(",")); };
  if(state.fileName) put("file", state.fileName);
  if(state.recordKey && arrayCandidates(state.raw).length>1) put("rec", state.recordKey);
  if(state.search) put("q", state.search);
  if(state.searchMode!=="plain") put("qm",state.searchMode);   // the default writes nothing
  /* One parameter per sort level, its name carrying the direction: sa/sd ascending
     or descending, sla/sld for the last-word variants. Levels are read back in the
     order they appear, so no numbering is needed — and they must stay one per
     parameter, since packing them would lose that order. */
  for(const s of state.sorts) if(s.k) put((s.last?"sl":"s")+(s.desc?"d":"a"), s.k);
  if(state.pageSize!==100) put("ps", String(state.pageSize));

  /* the card image is the one setting whose default is not "none", so "none" has to
     be written down — as an empty value, not a sentinel word */

  if(state.page>0) put("page", String(state.page+1));
  const clause=(n,terms)=>{                        // n is "" for the live set, 1,2,… for saved ones
    const present=[], missing=[];
    for(const [k,f] of terms){

      if(f.present) present.push(k);
      if(f.missing) missing.push(k);
    }
    list("p"+n, present); list("m"+n, missing);    // the flags name their fields, so no =1 needed
  };

  state.clauses.forEach((c,i)=>clause(i+1, c.terms));

/* Values are split on commas BEFORE decoding, so an encoded %2C stays part of its

function parseQuery(search){

    if(!pair) continue;
    const i=pair.indexOf("=");
    list.push([decQ(i<0?pair:pair.slice(0,i)), i<0?null:pair.slice(i+1)]);
  }
  return {
    list,
    one(k){ const e=list.find(x=>x[0]===k); return e ? (e[1]===null?"":decQ(e[1])) : null; },
    many(k){ return list.filter(x=>x[0]===k && x[1]).flatMap(x=>x[1].split(",").map(decQ)); }
  };
}

  const view=params.one("view"); if(view){ state.viewMode=view; $("#viewMode").value=view; }
